<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/embed.js"></script>
</head>
<body>
<header>
  <div class="brand">Rotación Sectorial</div>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/rotation.html">RRG</a>
    <a href="/rotation-stocks.html">RRG Acciones</a>
    <a href="/empresa.html">Fundamental</a>
    <a href="/watchlist.html">Watchlist</a>
    <a href="/screener.html" class="active">Screener</a>
  </nav>
</header>

<main>
  <div class="top">
    <div>
      <h1>Screener</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Cargando universo…</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnRefresh" title="Bajar datos en vivo de Yahoo">↻ Actualizar</button>
      <button class="btn" id="btnWeights">ⓘ Cómo puntúa</button>
      <button class="btn" id="btnPdfView">⤓ PDF de la vista</button>
      <button class="btn" id="btnAuth">Iniciar sesión</button>
    </div>
  </div>
  <div class="progress"><div id="prog"></div></div>

  <div class="kpis" id="kpis"></div>

  <div class="filters">
    <div class="frow">
      <input type="search" id="q" placeholder="Buscar ticker, CEDEAR o empresa">
      <select id="fCountry"><option value="">Todos los países</option></select>
      <select id="fLynch">
        <option value="">Todos los tipos Lynch</option>
        <option value="slow">Slow Grower</option><option value="stalwart">Stalwart</option><option value="fast">Fast Grower</option>
        <option value="cyclical">Cíclica</option><option value="turnaround">Turnaround</option><option value="asset">Asset Play</option>
      </select>
      <select id="fProf"><option value="">Todas las industrias</option></select>
      <select id="fCap">
        <option value="0">Cualquier tamaño</option><option value="1e9">Más de US$ 1 B</option>
        <option value="1e10">Más de US$ 10 B</option><option value="1e11">Más de US$ 100 B</option>
      </select>
      <select id="fPeer" title="Contra quién se compara cada acción para el score">
        <option value="sector">Score vs. su sector global</option>
        <option value="sector-country">Score vs. su sector en su país</option>
      </select>
      <label class="toggle"><input type="checkbox" id="fCand"> Solo candidatas</label>
      <label class="toggle"><input type="checkbox" id="fMine"> Solo con tu tesis</label>
    </div>
    <div class="frow"><span class="flabel">Mercado</span><div class="frow" id="fMarkets"></div></div>
    <div class="frow"><span class="flabel">Sector</span><div class="frow" id="fSectors"></div></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-v="table">Tabla</button>
    <button class="tab" data-v="sector">Por sector</button>
    <button class="tab" data-v="country">Por país</button>
    <button class="tab" data-v="compare">Comparar <span class="c" id="cmpCount">0</span></button>
  </div>
  <div id="view"></div>
</main>

<div class="cmpbar" id="cmpbar"><span id="cmpTxt"></span><button class="btn sm primary" id="cmpGo">Comparar</button><button class="btn sm" id="cmpClear">Limpiar</button></div>
<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<div id="printRoot"></div>

<script src="/config.js"></script>
<script type="module" src="/js/screener.js"></script>
</body>
</html>
