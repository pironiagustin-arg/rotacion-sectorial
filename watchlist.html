<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .lists { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .lists .chip .x { margin-left:6px; opacity:.6; } .lists .chip .x:hover { opacity:1; }
  .addrow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .addrow input { width:320px; max-width:100%; }
  .colpick { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:6px; margin-top:10px; }
  .colpick label { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); cursor:pointer; }
  .colpick input { accent-color:var(--accent); }
  .out td { color:var(--dim); }
  td .rm { background:none; border:none; color:var(--dim); font-size:17px; cursor:pointer; }
  td .rm:hover { color:var(--bad); }
</style>
</head>
<body>
<header>
  <div class="brand">Rotación Sectorial</div>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/rotation.html">RRG</a>
    <a href="/rotation-stocks.html">RRG Acciones</a>
    <a href="/empresa.html">Fundamental</a>
    <a href="/watchlist.html" class="active">Watchlist</a>
    <a href="/screener.html">Screener</a>
  </nav>
</header>
<main>
  <div class="top">
    <div>
      <h1>Watchlist</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Cargando…</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnCols">⚙ Columnas</button>
      <button class="btn" id="btnPdf">⤓ PDF de la lista</button>
    </div>
  </div>
  <div class="lists" id="lists"></div>
  <div class="addrow">
    <input type="search" id="add" list="tickers" placeholder="Agregar: CEDEAR, ticker o empresa" autocomplete="off">
    <datalist id="tickers"></datalist>
    <button class="btn primary" id="addBtn">Agregar a esta lista</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="view"></div>
</main>
<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>
<div id="printRoot"></div>
<script src="/js/embed.js"></script>
<script src="/config.js"></script>
<script type="module" src="/js/watchlist.js"></script>
</body>
</html>
