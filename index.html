<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotación Sectorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1220; --panel:#111a2e; --panel2:#16213a; --border:#1e2a44; --border2:#2b3a5c; --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  .bar { height:58px; display:flex; align-items:center; gap:18px; padding:0 20px; background:var(--panel); border-bottom:1px solid var(--border); }
  .brand { font-weight:700; font-size:15px; white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .brand i { width:22px; height:22px; border-radius:6px; background:var(--accent); display:inline-block; }
  nav { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1; }
  nav a { text-decoration:none; color:var(--muted); padding:7px 12px; border-radius:8px; font-size:14px; white-space:nowrap; }
  nav a:hover { color:var(--text); background:var(--panel2); }
  nav a.active { color:#fff; background:var(--accent); }
  .search { display:flex; gap:6px; }
  .search input { width:240px; background:var(--bg); border:1px solid var(--border2); border-radius:10px; padding:8px 11px; color:var(--text); font-family:inherit; font-size:13px; outline:none; }
  .search input:focus { border-color:var(--accent); }
  .loader { position:fixed; top:58px; left:0; height:2px; background:var(--accent); width:0; transition:width .4s; z-index:5; }
  iframe { display:block; width:100%; height:calc(100vh - 58px); border:0; background:var(--bg); }
  @media (max-width:860px) { .search input { width:140px; } .brand span { display:none; } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><i></i><span>Rotación Sectorial</span></div>
  <nav id="nav">
    <a data-r="dashboard" href="#dashboard">Dashboard</a>
    <a data-r="rrg" href="#rrg">RRG</a>
    <a data-r="rrg-acciones" href="#rrg-acciones">RRG Acciones</a>
    <a data-r="screener" href="#screener">Screener</a>
    <a data-r="empresa" href="#empresa">Fundamental</a>
    <a data-r="watchlist" href="#watchlist">Watchlist</a>
  </nav>
  <div class="search"><input type="search" id="q" list="tickers" placeholder="Ir a una empresa…" autocomplete="off" aria-label="Buscar empresa"><datalist id="tickers"></datalist></div>
</div>
<div class="loader" id="loader"></div>
<iframe id="frame" title="Contenido"></iframe>
<script type="module">
  import { UNIVERSE } from "/lib/universe.js";
  const ROUTES = { dashboard: "/dashboard.html", rrg: "/rotation.html", "rrg-acciones": "/rotation-stocks.html", screener: "/screener.html", empresa: "/empresa.html", watchlist: "/watchlist.html" };
  const BY_PATH = Object.fromEntries(Object.entries(ROUTES).map(([k, v]) => [v, k]));
  BY_PATH["/fundamentals.html"] = "empresa"; BY_PATH["/index.html"] = "dashboard";
  const frame = document.getElementById("frame"), loader = document.getElementById("loader");

  function parse() {
    const h = location.hash.slice(1) || "dashboard";
    const [route, qs] = h.split("?");
    return { route: ROUTES[route] ? route : "dashboard", qs: qs ? "?" + qs : "" };
  }
  function go() {
    const { route, qs } = parse();
    const src = ROUTES[route] + qs;
    setActive(route);
    if (frame.contentWindow?.location?.pathname + frame.contentWindow?.location?.search !== src) { loader.style.width = "70%"; frame.src = src; }
  }
  function setActive(route) { document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.r === route)); }

  frame.addEventListener("load", () => {
    loader.style.width = "100%"; setTimeout(() => { loader.style.width = "0"; }, 300);
    try {
      const loc = frame.contentWindow.location;
      const route = BY_PATH[loc.pathname];
      if (route === undefined && loc.pathname === "/") { frame.src = ROUTES.dashboard; return; }
      if (route) {
        const hash = "#" + route + loc.search;
        if (location.hash !== hash) history.pushState(null, "", hash);
        setActive(route);
      }
      document.title = (frame.contentDocument.title || "") + " · Rotación Sectorial";
      // Los cambios de URL dentro de la página (ej. otra empresa en la ficha) también actualizan la dirección
      const w = frame.contentWindow, sync = () => { const r = BY_PATH[w.location.pathname]; if (r) history.replaceState(null, "", "#" + r + w.location.search); document.title = (frame.contentDocument.title || "") + " · Rotación Sectorial"; };
      for (const fn of ["pushState", "replaceState"]) { const orig = w.history[fn].bind(w.history); w.history[fn] = (...a) => { orig(...a); sync(); }; }
      w.addEventListener("popstate", sync);
    } catch (e) {}
  });
  window.addEventListener("hashchange", go);
  window.addEventListener("popstate", () => go());

  const q = document.getElementById("q");
  document.getElementById("tickers").innerHTML = [...UNIVERSE].sort((a, b) => (a[3] === "AR") - (b[3] === "AR")).map((u) => `<option value="${u[5] || u[0]} · ${u[1].replace(/"/g, "&quot;")}">`).join("");
  const find = (v) => { v = v.trim().toUpperCase(); const m = v.match(/^([A-Z0-9.\-]+)\s+·/); if (m) v = m[1]; return (UNIVERSE.find((u) => u[0] === v || (u[5] || "").toUpperCase() === v) || UNIVERSE.find((u) => u[1].toUpperCase().includes(v)) || [])[0]; };
  const open = () => { const s = find(q.value); if (s) { location.hash = "#empresa?s=" + encodeURIComponent(s); q.value = ""; q.blur(); } };
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
  q.addEventListener("change", () => { if (find(q.value) && q.value.includes("·")) open(); });
  go();
</script>
</body>
</html>
