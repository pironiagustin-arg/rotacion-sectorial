<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de empresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .p .ext { font-size:14px; font-weight:500; }
  :root {
    --bg:#0b1220; --panel:#111a2e; --panel2:#16213a; --border:#1e2a44; --border2:#2b3a5c;
    --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b; --accent:#3b82f6; --accent-bg:#172554;
    --good:#22c55e; --good-bg:#14532d; --good-tx:#86efac;
    --mid:#eab308; --mid-bg:#713f12; --mid-tx:#fde68a;
    --bad:#ef4444; --bad-bg:#7f1d1d; --bad-tx:#fca5a5;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif; font-size:14px; line-height:1.5; }
  .num { font-variant-numeric:tabular-nums; }
  a { color:inherit; }
  button, select, input, textarea { font-family:inherit; font-size:13px; color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; }
  header .brand { font-weight:600; font-size:15px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav a { text-decoration:none; color:var(--muted); padding:6px 12px; border-radius:8px; }
  nav a:hover { color:var(--text); background:var(--panel2); }
  nav a.active { color:#fff; background:var(--accent); }
  main { max-width:1380px; margin:0 auto; padding:20px 24px 80px; }
  .searchbar { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .searchbar input { width:320px; max-width:100%; }
  input, select, textarea { background:var(--bg); border:1px solid var(--border2); border-radius:10px; padding:8px 11px; outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  .btn { background:var(--panel2); border:1px solid var(--border2); padding:8px 14px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.sm { padding:5px 10px; font-size:12px; border-radius:8px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px 20px; }
  .hero { display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; }
  .hero h1 { margin:0; font-size:28px; font-weight:700; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .hero h1 .alt { font-size:14px; color:var(--dim); font-weight:500; }
  .hero .name { font-size:16px; color:var(--muted); margin-top:2px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chip { background:var(--panel2); border:1px solid var(--border); color:var(--muted); padding:4px 10px; border-radius:99px; font-size:12px; }
  .chip.lynch { background:var(--accent-bg); color:#93c5fd; border-color:transparent; cursor:help; }
  .chip.cand { background:var(--good-bg); color:var(--good-tx); border-color:transparent; }
  .price { display:flex; gap:16px; align-items:baseline; margin-top:12px; flex-wrap:wrap; }
  .price .p { font-size:24px; font-weight:600; }
  .pos { color:var(--good); } .neg { color:var(--bad); } .na { color:var(--dim); }
  .ring { width:120px; height:120px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .v { font-size:38px; font-weight:700; line-height:1; } .ring .l { font-size:11px; margin-top:4px; opacity:.85; }
  .s-good { background:var(--good-bg); color:var(--good-tx); } .s-mid { background:var(--mid-bg); color:var(--mid-tx); }
  .s-bad { background:var(--bad-bg); color:var(--bad-tx); } .s-na { background:var(--panel2); color:var(--dim); }
  .oneliner { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:14.5px; }
  .oneliner b { color:var(--text); font-weight:600; }
  h2 { font-size:17px; font-weight:600; margin:28px 0 12px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  h2 .sub { font-size:12.5px; color:var(--dim); font-weight:400; }
  .verdicts { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .vd { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; border-top:3px solid var(--border2); }
  .vd.good { border-top-color:var(--good); } .vd.mid { border-top-color:var(--mid); } .vd.bad { border-top-color:var(--bad); }
  .vd .q { color:var(--muted); font-size:12.5px; display:flex; justify-content:space-between; }
  .vd .a { font-size:15px; font-weight:600; margin:4px 0 10px; }
  .vd .kv { display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-top:1px solid var(--border); }
  .vd .kv span:first-child { color:var(--muted); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .list div { display:flex; gap:8px; font-size:13.5px; padding:5px 0; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; }
  .ch h3 { margin:0; font-size:14px; font-weight:600; }
  .ch .read { color:var(--muted); font-size:12.5px; margin:3px 0 10px; min-height:18px; }
  .ch .box { position:relative; height:220px; }
  .tablewrap { background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:right; color:var(--dim); font-weight:500; font-size:11.5px; padding:10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { text-align:right; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; font-size:13px; }
  th.l, td.l { text-align:left; }
  tr.me td { background:rgba(59,130,246,.08); font-weight:600; }
  tr.peer { cursor:pointer; } tr.peer:hover td { background:var(--panel2); }
  .score { display:inline-block; min-width:36px; text-align:center; border-radius:8px; padding:2px 6px; font-weight:600; font-size:12.5px; }
  .mgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
  .m { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .m .l { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:6px; }
  .m .l .w { color:var(--dim); font-size:11px; }
  .m .v { font-size:18px; font-weight:600; margin:2px 0 6px; cursor:text; }
  .m .pb { height:5px; background:var(--border); border-radius:3px; overflow:hidden; } .m .pb div { height:100%; border-radius:3px; }
  .m .med { color:var(--dim); font-size:11.5px; margin-top:6px; }
  .m .q { color:var(--dim); font-size:11.5px; margin-top:4px; line-height:1.4; }
  .m input { width:100%; padding:4px 6px; font-size:14px; }
  .edited { color:#93c5fd; } .edited::after { content:" •"; }
  .thesis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .thesis label { color:var(--dim); font-size:12px; display:grid; gap:5px; }
  .thesis .full { grid-column:1/-1; }
  .thesis textarea { min-height:100px; resize:vertical; }
  .fair { display:flex; gap:20px; flex-wrap:wrap; align-items:baseline; background:var(--panel2); border-radius:12px; padding:12px 14px; margin-top:4px; }
  .fair .big { font-size:22px; font-weight:700; }
  .how td, .how th { font-size:12.5px; }
  tr.med td { font-size:12px; }
  .about { margin-top:12px; }
  .about-h { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:15px; }
  .about-h a { color:#93c5fd; font-size:12.5px; text-decoration:none; }
  .about-t { color:var(--muted); font-size:14px; line-height:1.65; margin:8px 0 4px; }
  .about-t.clamp { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .linkbtn { background:none; border:none; color:#93c5fd; cursor:pointer; padding:0; font-size:12.5px; font-family:inherit; }
  .about-f { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px; margin-top:12px; }
  .about-f div { background:var(--panel2); border-radius:10px; padding:8px 11px; display:grid; gap:2px; }
  .about-f span { color:var(--dim); font-size:11.5px; } .about-f b { font-size:14px; font-weight:600; }
  .verdict { font-size:14.5px; line-height:1.6; padding:12px 14px; background:var(--panel2); border-radius:12px; margin-bottom:12px; }
  .tz { gap:22px; margin-bottom:10px; } .tz h4, #autoThesis h4 { margin:6px 0 6px; font-size:13.5px; font-weight:600; }
  .tl { margin:0; padding-left:18px; display:grid; gap:6px; font-size:13.5px; line-height:1.5; }
  .byma { display:flex; flex-wrap:wrap; gap:6px; align-items:baseline; font-size:13px; margin-top:10px; padding:8px 12px; background:var(--panel2); border-radius:10px; }
  .byma:empty { display:none; } .byma .lab { color:var(--muted); font-size:12px; } .byma .sep { color:var(--dim); }
  details.fold > summary { list-style:none; cursor:pointer; } details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary h2::before { content:"▸ "; color:var(--dim); } details.fold[open] > summary h2::before { content:"▾ "; }
  .talk { background:var(--panel2); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .talk h4 { margin:0 0 8px !important; }
  .talk-read { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .pill { font-size:11.5px; padding:3px 9px; border-radius:99px; border:1px solid var(--border2); color:var(--text); }
  .pill.pos { background:var(--good-bg,rgba(34,197,94,.12)); color:#86efac; border-color:transparent; } .pill.neg { background:var(--bad-bg,rgba(239,68,68,.12)); color:#fca5a5; border-color:transparent; } .pill.dim { color:var(--muted); }
  .talk blockquote { margin:8px 0; padding:8px 12px; border-left:3px solid var(--accent,#3b82f6); font-size:13.5px; line-height:1.6; color:var(--text); }
  .talk cite { display:block; margin-top:4px; font-style:normal; color:var(--muted); font-size:12px; }
  .tl .tag { display:inline-block; font-size:10.5px; color:#93c5fd; background:var(--accent-bg); border-radius:99px; padding:1px 7px; margin-right:6px; vertical-align:1px; }
  .tl.links a { color:var(--text); text-decoration:none; } .tl.links a:hover { color:#93c5fd; }
  .tam { background:var(--panel2); border-radius:12px; padding:12px 14px; font-size:13px; }
  .tamg { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:8px; }
  .tamg label { color:var(--dim); font-size:11.5px; display:grid; gap:4px; }
  .x { background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; line-height:1; padding:0 4px; }
  .x:hover { color:var(--bad); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-top:12px; }
  .kp { display:grid; gap:4px; background:var(--panel2); border-radius:10px; padding:10px 12px; }
  .kp .l { color:var(--muted); font-size:12px; } .kp .v { font-size:17px; font-weight:600; } .kp .h { color:var(--dim); font-size:11px; }
  .kp input { padding:6px 8px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .empty { text-align:center; color:var(--muted); padding:60px 16px; }
  .skeleton { color:var(--dim); font-size:13px; padding:20px 0; }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--panel2); border:1px solid var(--border2); padding:10px 14px; border-radius:10px; display:none; z-index:60; }
  .toast.show { display:block; }
  .src { color:var(--dim); font-size:11.5px; margin-top:8px; }
  #printRoot { display:none; }
  html.embedded header { display:none; }
  html.embedded main { padding-top:16px; }
  html.embedded .searchbar { display:none; }

  /* ── Fundamentals estilo Koyfin (js/fundview.js) ── */
  .kf-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; position:relative; }
  .kf-load { color:var(--muted); text-align:center; padding:30px; }
  .kf-mut { color:var(--muted); font-size:12px; }
  .kf-top { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
  .kf-left { display:flex; flex-direction:column; gap:12px; }
  .kf-head { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .kf-id { display:flex; gap:12px; align-items:center; }
  .kf-logo { width:50px; height:50px; border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; }
  .kf-logo img { width:36px; height:36px; object-fit:contain; } .kf-logo span { font-weight:700; font-size:17px; color:#0b1220; }
  .kf-name { font-size:17px; font-weight:700; }
  .kf-stats { display:grid; grid-template-columns:repeat(3,auto); gap:3px 20px; border:1px solid var(--border2); border-radius:12px; padding:9px 14px; text-align:center; }
  .kf-stats b { display:block; font-size:17px; font-variant-numeric:tabular-nums; } .kf-stats span { font-size:11px; color:var(--muted); }
  .kf-stats small { grid-column:1/-1; font-size:10px; color:var(--dim); }
  .kf-stats i, .kf-ret { font-style:normal; font-weight:600; font-size:10.5px; padding:1px 5px; border-radius:5px; margin-left:3px; }
  .kf-ret { font-size:11.5px; padding:5px 9px; margin:0; }
  i.up, .kf-ret.up { background:rgba(34,197,94,.15); color:var(--good); } i.dn, .kf-ret.dn { background:rgba(239,68,68,.15); color:var(--bad); }
  .kf-h { margin:0 0 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .kf-tw { overflow-x:auto; }
  .kf-tbl td, .kf-tbl th { padding:8px 9px; } .kf-tbl td.l { color:var(--muted); }
  .kf-tbl .b { font-weight:700; } .kf-tbl .sep { border-left:1px dashed var(--border2); }
  .kf-note { font-size:10.5px; color:var(--dim); text-align:right; margin-top:6px; }
  .kf-price { display:flex; flex-direction:column; gap:8px; } .kf-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .kf-seg { display:inline-flex; gap:2px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:3px; flex-wrap:wrap; }
  .kf-seg button { background:none; border:none; border-radius:7px; padding:5px 10px; font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; }
  .kf-seg button.on { background:var(--good); color:#04130a; }
  .kf-switch { display:flex; justify-content:center; margin:14px 0 10px; }
  .kf-switch .kf-seg button { padding:8px 18px; font-size:13px; } .kf-switch .kf-seg button.on { background:var(--panel2); color:var(--text); }
  .kf-ctrl { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 14px; margin-bottom:12px; }
  .kf-tog { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); border-radius:10px; padding:6px 10px; }
  .kf-tog input { display:none; } .kf-tog i { width:30px; height:16px; border-radius:9px; background:#334155; position:relative; transition:.2s; }
  .kf-tog i::after { content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:.2s; }
  .kf-tog input:checked + i { background:var(--good); } .kf-tog input:checked + i::after { left:16px; }
  .kf-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .kf-ch h5 { margin:0 0 6px; text-align:center; font-size:13px; }
  .kf-q { position:absolute; top:10px; left:10px; width:20px; height:20px; border-radius:50%; border:1px solid var(--border2); background:var(--panel2); color:var(--muted); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; z-index:3; }
  .kf-q:hover { color:#fff; border-color:var(--accent); background:var(--accent); }
  .kf-pop { position:absolute; top:36px; left:10px; right:10px; z-index:5; background:#0d1526; border:1px solid var(--accent); border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.55; color:var(--text); box-shadow:0 12px 32px rgba(0,0,0,.5); max-height:300px; overflow:auto; }
  .kf-pop > div { margin-bottom:4px; } .kf-pq { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:#93c5fd; margin:8px 0 3px; font-weight:600; } .kf-pq:first-of-type { margin-top:0; }
  .kf-pop b.pos, .kf-pop .pos { color:var(--good); } .kf-pop b.neg, .kf-pop .neg { color:var(--bad); } .kf-pop .mid { color:var(--mid); }
  .kf-pt { background:rgba(234,179,8,.1); border-radius:8px; padding:6px 8px; color:#fde68a; margin-top:6px; }
  .kf-px { position:absolute; top:6px; right:8px; background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; line-height:1; }
  .kf-leg { display:flex; justify-content:center; gap:12px; font-size:11px; color:var(--muted); margin-bottom:4px; flex-wrap:wrap; }
  .kf-leg i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .kf-miss { display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); font-size:12.5px; }
  .kf-nod { padding:40px 0; text-align:center; }
  .fc { position:relative; width:100%; } .fc svg { display:block; }
  .fc .gl { stroke:#1a2540; stroke-width:1; } .fc .ax { fill:#6b7893; font:10px Inter,sans-serif; }
  .fc .avg { stroke:#cbd5e1; stroke-dasharray:5 4; stroke-width:1; opacity:.7; }
  .fc .avgbg { fill:var(--panel); opacity:.85; } .fc .avgt { fill:#e2e8f0; font:600 10px Inter,sans-serif; }
  .fc .hx { stroke:#64748b; stroke-dasharray:3 3; }
  .kf-tip { position:absolute; top:6px; display:none; pointer-events:none; background:var(--panel2); border:1px solid var(--border2); border-radius:8px; padding:6px 9px; font-size:11.5px; white-space:nowrap; z-index:2; }
  .kf-tip b { display:block; font-size:11px; color:var(--muted); font-weight:500; margin-bottom:2px; }
  .kf-tip i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; } .kf-tip span { font-weight:600; font-variant-numeric:tabular-nums; }
  .kf-peg { text-align:center; font-size:12px; color:var(--muted); margin:-2px 0 4px; } .kf-peg b { color:#facc15; font-size:13px; } .kf-peg span { color:var(--dim); font-size:11px; }
  .fc .gtx { font:600 9.5px Inter,sans-serif; } .fc .gtx.gp { fill:#fcd34d; } .fc .gtx.gn { fill:#fca5a5; }
  .kf-ddl { font-size:12px; font-weight:600; margin-top:4px; } .kf-ddl b.pos { color:var(--good); } .kf-ddl b.neg { color:var(--bad); } .kf-ddl b.mid { color:var(--mid); }
  .kf-peg b.pos { color:var(--good); } .kf-peg b.neg { color:var(--bad); }
  .kf-diff { margin-top:12px; } .kf-diff h5 { margin:0 0 10px; font-size:13px; }
  .kf-drow { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  @media (max-width:900px) { .kf-drow { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .kf-dt { background:var(--bg); border:1px solid var(--border); border-top:3px solid var(--border2); border-radius:10px; padding:10px 12px; }
  .kf-dt.cheap { border-top-color:var(--good); } .kf-dt.exp { border-top-color:var(--bad); } .kf-dt.eq { border-top-color:var(--mid); }
  .kf-dl { color:var(--muted); font-size:12px; }
  .kf-dd { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; margin-top:2px; }
  .kf-dt.cheap .kf-dd { color:var(--good); } .kf-dt.exp .kf-dd { color:var(--bad); } .kf-dt.eq .kf-dd { color:var(--mid); }
  .kf-ds { font-size:11px; color:var(--dim); }
