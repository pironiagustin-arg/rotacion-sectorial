<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/embed.js"></script>
<style>
  main { max-width:1500px; }
  .form { display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr auto; gap:8px; align-items:end; }
  .form label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .form input, .form select { width:100%; }
  @media (max-width:900px) { .form { grid-template-columns:1fr 1fr; } }
  input[type=date] { color-scheme:dark; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; min-height:16px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:12px; margin-top:12px; }
  .card h3 { margin:0 0 10px; font-size:14.5px; font-weight:600; }
  .expo { display:grid; gap:6px; }
  .expo .r { display:grid; grid-template-columns:150px 1fr 54px; gap:8px; align-items:center; font-size:12.5px; }
  .expo .r .b { height:8px; background:var(--border); border-radius:4px; overflow:hidden; } .expo .r .b i { display:block; height:100%; background:var(--accent); }
  .expo .r span:first-child { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seg { display:inline-flex; border:1px solid var(--border2); border-radius:10px; overflow:hidden; margin-bottom:10px; }
  .seg button { background:transparent; border:none; color:var(--muted); padding:6px 11px; font-size:12px; cursor:pointer; font-family:inherit; }
  .seg button.on { background:var(--accent); color:#fff; }
  td .rm { background:none; border:none; color:var(--dim); font-size:17px; cursor:pointer; } td .rm:hover { color:var(--bad); }
  td.l a { color:var(--text); text-decoration:none; } td.l a:hover { color:#93c5fd; }
  tfoot td { font-weight:600; border-top:1px solid var(--border2); }
</style>
</head>
<body>
<header><div class="brand">Rotación Sectorial</div><nav><a href="/">App</a></nav></header>
<main>
  <div class="top">
    <div><h1>Mi cartera</h1><div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Cargando…</span></div></div>
    <div class="actions"><button class="btn" id="btnCsv">⤓ Exportar CSV</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <h3>Agregar una compra</h3>
    <div class="form">
      <label>Activo<input type="search" id="fT" list="tickers" placeholder="CEDEAR o acción (ej. AAPL, GGAL)" autocomplete="off"><datalist id="tickers"></datalist></label>
      <label>Fecha<input type="date" id="fD"></label>
      <label>Cantidad<input type="number" id="fQ" min="0" step="any" placeholder="CEDEARs"></label>
      <label>Moneda<select id="fC"><option value="ARS">Pesos</option><option value="USD">Dólares (MEP)</option></select></label>
      <label>Precio por unidad<input type="number" id="fP" min="0" step="any" placeholder="se completa solo"></label>
      <button class="btn primary" id="fAdd">Agregar</button>
    </div>
    <div class="hint" id="fHint">Cargá el ticker y la fecha: el precio de cierre de ese día se completa solo (podés corregirlo). Si compraste en pesos, el costo en dólares se calcula con el CCL de ese día.</div>
  </div>
  <div id="view" style="margin-top:12px"></div>
  <div class="grid2">
    <div class="card"><h3>Exposición</h3><div class="seg" id="expoBy"><button data-b="sec" class="on">Sector</button><button data-b="c">País</button><button data-b="lynch">Tipo Lynch</button><button data-b="cur">Moneda</button></div><div class="expo" id="expo"></div></div>
    <div class="card"><h3>Calendario de resultados · próximos 30 días</h3><div id="earn"></div></div>
  </div>
</main>
<div id="toast" class="toast"></div>
<script src="/config.js"></script>
<script type="module" src="/js/cartera.js"></script>
</body>
</html>
