name: Sync screener
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19:30 Buenos Aires, después del cierre de Wall Street
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar lotes
        env:
          SITE: ${{ secrets.SITE_URL }}
          SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          b=0; fails=0; total=0
          while [ "$b" != "null" ]; do
            out=$(curl -s -m 70 -H "x-sync-secret: $SECRET" "$SITE/api/sync?batch=$b" || echo '{"error":"timeout"}')
            echo "lote $b -> $out"
            if echo "$out" | jq -e '.error' >/dev/null 2>&1; then fails=$((fails+1)); else total=$((total + $(echo "$out" | jq -r '.saved // 0'))); fi
            if echo "$out" | jq -e 'has("next")' >/dev/null 2>&1; then b=$(echo "$out" | jq -r '.next // "null"'); else echo "::error::Respuesta inesperada, corto acá"; exit 1; fi
            sleep 3
          done
          echo "Guardadas: $total acciones · lotes con error: $fails"
          [ "$total" -gt 0 ] || { echo "::error::No se guardó ninguna acción"; exit 1; }
      - name: Señales de rotación (RRG)
        env:
          SITE: ${{ secrets.SITE_URL }}
          SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          out=$(curl -s -m 70 -H "x-sync-secret: $SECRET" "$SITE/api/signals?save=1")
          echo "$out" | jq -r '.signals[] | select(.status != null) | "\(.symbol) \(.status) \(.score)"' || echo "$out"
          echo "$out" | jq -e '.saved' >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Candidatas del día (seguimiento del score)
        env:
          SITE: ${{ secrets.SITE_URL }}
        run: node scripts/compute.mjs picks
      - name: Guardar resultados en el repo
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Datos: candidatas del día"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
