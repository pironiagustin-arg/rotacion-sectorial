name: Sync fundamentales
on:
  schedule:
    - cron: "15 12 * * 0"   # domingos 9:15 Buenos Aires
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar lotes
        env:
          SITE: ${{ secrets.SITE_URL }}
          SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          b=0; total=0
          while [ "$b" != "null" ]; do
            out=$(curl -s -m 70 -H "x-sync-secret: $SECRET" "$SITE/api/sync-fund?batch=$b" || echo '{"error":"timeout"}')
            echo "lote $b -> $out"
            total=$((total + $(echo "$out" | jq -r '.saved // 0' 2>/dev/null || echo 0)))
            if echo "$out" | jq -e 'has("next")' >/dev/null 2>&1; then b=$(echo "$out" | jq -r '.next // "null"'); else echo "::error::Respuesta inesperada"; exit 1; fi
            sleep 2
          done
          echo "Guardadas: $total empresas"
          [ "$total" -gt 0 ] || { echo "::error::No se guardó ninguna empresa"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Backtest del score y 13F de grandes fondos
        run: |
          node scripts/compute.mjs backtest
          node scripts/compute.mjs funds
      - name: Guardar resultados en el repo
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Datos: backtest y 13F"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
