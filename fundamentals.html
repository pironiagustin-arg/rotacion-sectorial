<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Análisis Fundamental</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262a33; --text:#e6e8eb; --muted:#8b8f99; --accent:#4C6EF5; --green:#2F9E44; --red:#E03131; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1 { font-size:17px; margin:0; }
  nav { display:flex; align-items:center; gap:2px; }
  nav a { color:var(--muted); text-decoration:none; margin-left:14px; font-size:13.5px; }
  nav a:hover, nav a.active { color:var(--text); }
  .langsw { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; margin-left:16px; }
  .langsw button { background:#12151b; color:var(--muted); border:none; padding:5px 10px; font-size:11px; font-weight:600; cursor:pointer; }
  .langsw button.on { background:var(--accent); color:#fff; }
  .container { padding:18px 20px 40px; max-width:1180px; margin:0 auto; }
  .search-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  input[type=text] { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:9px 14px; border-radius:8px; font-size:14px; width:140px; text-transform:uppercase; }
  button, select { font-family:inherit; }
  button.primary { background:var(--accent); color:#fff; border:none; padding:9px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
  .recent { display:flex; gap:6px; flex-wrap:wrap; }
  .recent button { background:var(--panel); border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
  .recent button:hover { color:var(--text); }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .header-row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .company-name { font-size:20px; font-weight:600; }
  .company-sub, .muted { color:var(--muted); font-size:12.5px; }
  .lynch-row { display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap; }
  .lynch-badge { display:inline-block; background:#232838; border:1px solid var(--border); border-radius:999px; padding:3px 11px; font-size:11.5px; }
  select { background:#12151b; border:1px solid var(--border); color:var(--text); padding:6px 9px; border-radius:8px; font-size:12.5px; }
  .score-ring { text-align:center; }
  .score-num { font-size:32px; font-weight:700; line-height:1; }
  .score-label { font-size:10.5px; color:var(--muted); margin-top:4px; }
  .price-big { font-size:24px; font-weight:600; text-align:right; }
  .score-detail { display:flex; gap:8px; flex-wrap:wrap; margin-top:11px; align-items:center; }
  .score-detail span { font-size:11.5px; color:var(--muted); background:#12151b; border:1px solid var(--border); border-radius:6px; padding:3px 8px; }
  .cards-title { font-size:11.5px; color:var(--muted); margin:0 0 12px; line-height:1.5; }
  .cards-title b { color:#b8bcc4; }
  .metrics-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .metric { background:#12151b; border:1px solid var(--border); border-left:3px solid #3a3f4b; border-radius:7px; padding:8px 10px; cursor:pointer; transition:background .15s; position:relative; }
  .metric:hover { background:#161a22; }
  .metric.sel { outline:1.5px solid var(--accent); outline-offset:-1px; }
  .metric .k { font-size:10.5px; color:var(--muted); padding-right:18px; line-height:1.25; }
  .metric .v { font-size:16px; font-weight:600; margin-top:2px; }
  .metric .d { font-size:10.5px; margin-top:2px; color:var(--muted); min-height:12px; }
  .metric .eye { position:absolute; top:5px; right:5px; background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; border-radius:5px; line-height:0; }
  .metric .eye:hover { color:var(--text); background:#232838; }
  .metric.off { opacity:.36; filter:grayscale(.8); }
  .metric.off .k { text-decoration:line-through; }
  .metric.nodata { opacity:.28; cursor:default; }
  .metric .wt { color:#F59F00; font-size:10px; }
  .rank { position:relative; height:16px; margin-top:6px; }
  .rank .track { position:absolute; left:0; right:0; top:7px; height:2.5px; border-radius:2px; background:#2a2f3a; }
  .rank .dot { position:absolute; top:0; transform:translateX(-50%); min-width:18px; height:16px; border-radius:8px; color:#fff; font-size:9.5px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .rank.none { height:0; margin:0; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:12px; }
  .controls label.lbl { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button { background:#12151b; color:var(--muted); border:none; padding:6px 11px; font-size:11.5px; cursor:pointer; border-right:1px solid var(--border); }
  .seg button:last-child { border-right:none; }
  .seg button.on { background:var(--accent); color:#fff; }
  .toggle { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .chart-wrap { position:relative; height:360px; }
  .loading { color:var(--muted); padding:40px; text-align:center; }
  @media (max-width:640px) { .chart-wrap { height:280px; } .price-big { text-align:left; } }
  .cat-tabs { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
  .cat-tab { font-family:inherit; font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:#b8bcc4; padding:8px 10px; background:#12151b; border:1px solid var(--border); border-radius:8px; display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none; white-space:nowrap; }
  .cat-tab:hover { background:#161a22; color:var(--text); }
  .cat-tab.expanded { border-color:var(--accent); color:var(--text); }
  .cat-tab .chev { transition:transform .15s; color:var(--muted); display:flex; }
  .cat-tab.expanded .chev { transform:rotate(180deg); }
  .cat-tab .count { color:var(--muted); font-weight:400; font-size:10.5px; text-transform:none; letter-spacing:0; }
  .cat-tab .grp { background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; border-radius:6px; line-height:0; margin-left:2px; }
  .cat-tab .grp:hover { color:var(--text); background:#232838; }
  .cat-body-panel { border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-bottom:8px; }
  .cat-body-panel:last-child { margin-bottom:0; }
  .cat-body-head { font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:#b8bcc4; padding:8px 12px; background:#12151b; border-bottom:1px solid var(--border); }
  .cat-body-panel .metrics-grid { padding:10px; }
  .chart-panel.active { border-color:var(--accent); }
  .ptitle { font-size:11.5px; font-weight:600; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#12151b; border:1px solid var(--border); border-radius:999px; padding:3px 6px 3px 10px; font-size:11.5px; }
  .chip .x { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; line-height:1; padding:0 4px; }
  .chip .typebtn { background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; line-height:0; border-radius:4px; }
  .chip .typebtn:hover { color:var(--text); background:#232838; }
  .chip .x:hover { color:#ff8787; }
  .dot2 { display:inline-block; width:9px; height:9px; border-radius:50%; }
  .rm { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:5px 9px; cursor:pointer; margin-left:auto; }
  .rm:hover { color:#ff8787; border-color:#ff8787; }
  .addpanel { width:100%; background:transparent; border:1px dashed var(--border); color:var(--muted); padding:13px; border-radius:12px; cursor:pointer; font-size:13.5px; margin-bottom:14px; }
  .addpanel:hover { color:var(--text); border-color:var(--accent); }
  .footnote { font-size:10.5px; color:var(--muted); margin-top:9px; line-height:1.5; }
  .footnote div { margin-top:3px; }
  .reset { background:none; border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:3px 9px; font-size:11.5px; cursor:pointer; }
  .reset:hover { color:var(--text); }
  .guide-head { margin-bottom:11px; font-size:14.5px; }
  .guide-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; }
  .gt { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:6px; }
  .gl { font-size:12.5px; line-height:1.45; margin-bottom:4px; }
  .ck { display:inline-block; width:15px; text-align:center; font-weight:700; }
  .ck.ok { color:#69db7c; } .ck.no { color:#ff8787; } .ck.na { color:#8b8f99; }
  .score-warn { font-size:10.5px; color:#F59F00; margin-top:4px; max-width:180px; }
  .collapse-all { font-size:11.5px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline; }
</style>
</head>

<header>
  <h1 id="hTitle">🔎 Análisis Fundamental</h1>

// ---------- formato ----------
function fmtBig(v) {
  if (v == null) return '—';
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e12) return s + (a / 1e12).toFixed(2) + 'T';
  if (a >= 1e9) return s + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return s + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return s + (a / 1e3).toFixed(2) + 'K';
  return s + a.toFixed(2);
}
function fmt(v, unit) {
  if (v == null || !isFinite(v)) return '—';
  if (unit === 'usd') return fmtBig(v);
  if (unit === 'usdps') return '$' + v.toFixed(2);
  if (unit === 'pct') return v.toFixed(Math.abs(v) < 10 ? 2 : 1) + '%';
  if (unit === 'x') return v.toFixed(2) + '×';
  if (unit === 'num') return v.toFixed(2);
  return String(v);
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function favRank(k) {

// Bandas de tus dos capturas: la general (image1, "de manual") y la de Tech/Fast Grower (image2, más

function band4(v, b1, b2, b3, s1, s2, s3, s4) { return v <= b1 ? s1 : v <= b2 ? s2 : v <= b3 ? s3 : s4; }
function ruleScore(k) {

      if (isTech) return band4(v, 23, 40, 65, 100, 70, 40, 15); // Barato/Razonable/Caro/Muy caro
      return band4(v, 12, 18, 35, 100, 70, 40, 15); // Muy barato/Razonable/Caro/Muy caro
    case 'peForward': return v <= 0 ? null : v < 20 ? 100 : v <= 35 ? 65 : 25; // Barato/Razonable/Caro
    case 'psRatio': return isTech ? band4(v, 4, 8, 12, 100, 70, 40, 15) : null; // Barato/Razonable/Caro/Muy caro (Tech)
    case 'evEbitda': return band4(v, 15, 25, 35, 100, 70, 40, 15); // Atractivo/Razonable/Caro/Muy caro
    case 'peg': return v <= 0 ? null : v < 1 ? 100 : v <= 1.5 ? 75 : v <= 2 ? 45 : 15;
    case 'roe': {
      const de = cur('debtToEquity'); if (v > 25 && de != null && de > 1.5) return 30; // ROE alto + deuda alta = trampa
      if (isTech) return v > 25 ? 100 : v >= 15 ? 65 : 30; // "Excelente" > 25%
      return v >= 18 ? 100 : v >= 12 ? 70 : v >= 7 ? 40 : 15;
    }
    case 'roa': return isTech ? (v > 12 ? 100 : v >= 6 ? 60 : 25) : (v >= 6 ? 100 : v >= 3 ? 65 : v >= 1 ? 35 : 15);
    case 'roic': return v > 12 ? 100 : v >= 8 ? 55 : 20;
    case 'grossMargin': return v >= 40 ? 100 : v >= 25 ? 70 : v >= 10 ? 40 : 15;
    case 'opMargin': return v >= 20 ? 100 : v >= 10 ? 70 : v >= 5 ? 40 : 15;
    case 'netMargin': {
      if (isTech) return v > 20 ? 100 : v >= 12 ? 65 : 25; // Excelente >20% / Bueno-Aceptable 12-20%
      return v >= 12 ? 100 : v >= 6 ? 65 : v >= 2 ? 35 : 10;
    }
    case 'debtToEquity': {
      if (isTech) return v <= 0.5 ? 100 : v <= 1.2 ? 60 : 15; // Excelente/Aceptable/Peligro
      return v <= 0.3 ? 100 : v <= 1.5 ? 65 : v <= 3 ? 35 : 10;
    }
    case 'debtToEbitda': return v < 1 ? 100 : v < 2 ? 85 : v < 3 ? 60 : v < 5 ? 25 : 5;
    case 'netDebtToEbitda': {

      if (isTech) return v < 1 ? 100 : v <= 2.5 ? 60 : 15; // Excelente / Aceptable / Peligro
      return v < 1 ? 100 : v < 2 ? 85 : v < 3 ? 60 : v < 5 ? 25 : 5;
    }
    case 'fcfYield': return v > 8 ? 100 : v > 5 ? 85 : v >= 2 ? 55 : v >= 0 ? 25 : 0;
    case 'payoutRatio': return v <= 60 ? 100 : v <= 70 ? 75 : v <= 80 ? 40 : 10;
    case 'dividendYield': return t === 'slowGrower' ? (v >= 3 && v <= 6 ? 100 : v > 6 ? 70 : v >= 2 ? 60 : 25) : null;
    case 'altmanZ': return v > 2.99 ? 100 : v >= 1.8 ? 50 : 10;
    case 'currentRatio': {
      if (isTech) return v > 1.5 ? 100 : v >= 1 ? 60 : 15; // Muy líquida / Equilibrada / Problemas de caja
      return v >= 2 ? 100 : v >= 1.5 ? 75 : v >= 1 ? 45 : 15;
    }
    case 'pbRatio': {
      if (t === 'assetPlay') return v < 1 ? 100 : v < 1.5 ? 70 : v < 3 ? 40 : 15;
      if (isTech) return v >= 5 && v <= 12 ? 100 : v < 5 ? 65 : v <= 15 ? 50 : 20; // "normal para Tech" 5x-12x

    case 'epsGrowth': { const a = ann(k); const g = a.length ? a[a.length - 1].v : null; return g == null ? null : g >= 25 ? 100 : g >= 15 ? 70 : g >= 5 ? 40 : 15; }
    case 'revenueGrowth': {
      const a = ann(k); const g = a.length ? a[a.length - 1].v : null; if (g == null) return null;
      if (t === 'fastGrower') return g > 20 ? 100 : g >= 10 ? 60 : 20;

// bolita de RSI(14) y MACD: técnicos de precio, no entran al score (dir:0) pero se colorean por regla
function techScore(k) {
  if (k === 'rsi14') { const v = cur('rsi14'); return v == null ? null : v <= 35 ? 100 : v <= 70 ? 55 : 15; }
  if (k === 'macd') { const m = cur('macd'), sg = cur('macdSignal'); if (m == null || sg == null) return null; return m > sg ? 100 : m < sg ? 15 : 55; }
  return null;
}
function metricScore(k) {
  const f = favRank(k), r = ruleScore(k);
  if (f != null && r != null) return 0.5 * f + 0.5 * r;
  return r ?? f;
}
function computeScore() {
  const ex = excludedSet(), w = T().w || {};

  const groups = SCORE_GROUPS_T.map(([names, cats]) => ({ names, cats, num: 0, den: 0 }));
  Object.keys(data.metrics).forEach((k) => {
    if (!scorable(k) || data.metrics[k].current == null) return;
    total++;
    if (ex.has(k)) return;
    const s = metricScore(k); if (s == null) return;
    const wt = w[k] ?? 1;

}

function annVal(k, p) { const x = series(k, 'annual').find((y) => y.p === String(p)); return x && x.v != null ? x.v : null; }
function annGrowth(k, p) { const a = annVal(k, p), b = annVal(k, Number(p) - 1); return a != null && b ? (a / b - 1) * 100 : null; }

  if (p.length < 60) return null;

    const g = ann('epsGrowth'); ok(g.length ? g[g.length - 1].v > 0 : null, tt('Crecimiento de ganancias positivo y estable', 'Positive and stable earnings growth'));
  } else if (tp === 'fastGrower') {

    const a = ann('revenueGrowth'); const g = a.length ? a[a.length - 1].v : null; ok(g == null ? null : g > 20, tt(`Crecimiento de ingresos > 20% sostenido (último año ${g == null ? '—' : g.toFixed(1) + '%'})`, `Revenue growth > 20% sustained (last year ${g == null ? '—' : g.toFixed(1) + '%'})`));
  } else if (tp === 'cyclical') {

    const nd = cur('netDebtToEbitda'); ok(nd == null ? null : nd < 3, tt(`Deuda neta/EBITDA razonable para aguantar la recesión (${fmt(nd, 'x')})`, `Reasonable net debt/EBITDA to withstand the recession (${fmt(nd, 'x')})`));
  } else if (tp === 'turnaround') {

    const nd = cur('netDebtToEbitda'); ok(nd == null ? null : nd < 3, tt(`Deuda neta/EBITDA < 3 (${fmt(nd, 'x')})`, `Net debt/EBITDA < 3 (${fmt(nd, 'x')})`));
    const oc = cur('operatingCashFlow'); ok(oc == null ? null : oc > 0, tt('Flujo operativo positivo', 'Positive operating cash flow'));
    out.push({ ok: null, text: tt('Plan de reestructuración concreto (revisar manualmente en el 10-K / conference calls)', 'Concrete restructuring plan (check manually in the 10-K / earnings calls)') });

    out.push({ ok: null, text: tt('¿Cuánto valen los activos si se liquidan? (revisar manualmente)', 'How much are the assets worth if liquidated? (check manually)') });

function alarms() {

  const P0 = ann('revenue').at(-1)?.p;
  const rg = annGrowth('revenue', P0), fg = annGrowth('fcf', P0), dg = annGrowth('totalDebt', P0), ig = annGrowth('inventory', P0);
  chk(rg == null || fg == null ? null : rg > 0 && fg < 0, tt('Ingresos crecen pero el FCF baja', 'Revenue is growing but FCF is falling'));
  chk(rg == null || dg == null ? null : dg > 0 && dg > rg + 1, tt(`Deuda crece más rápido que los ingresos (deuda ${dg == null ? '—' : dg.toFixed(0) + '%'} vs ingresos ${rg == null ? '—' : rg.toFixed(0) + '%'})`, `Debt grows faster than revenue (debt ${dg == null ? '—' : dg.toFixed(0) + '%'} vs revenue ${rg == null ? '—' : rg.toFixed(0) + '%'})`));
  chk(ann('opMargin').length >= 4 ? decliningYears('opMargin', 3) : null, tt('Margen operativo se achica año a año (3 años seguidos)', 'Operating margin is shrinking year over year (3 years in a row)'));
  chk(rg == null || ig == null ? null : ig > rg && ig > 0, tt('Inventario crece más que las ventas', 'Inventory is growing faster than sales'));
  const ni = annVal('netIncome', P0), oc = annVal('operatingCashFlow', P0);

  const pe = cur('peRatio'), rgl = ann('revenueGrowth').at(-1)?.v;
  if (tp !== 'cyclical' && on('peRatio')) chk(pe == null || rgl == null ? null : pe > 30 && rgl < 15, tt('P/E > 30 sin crecimiento fuerte que lo justifique', 'P/E > 30 with no strong growth to justify it'));
  const peg = cur('peg'); if (on('peg')) chk(peg == null ? null : peg > 2, tt(`PEG > 2: estás pagando de más por el crecimiento (${fmt(peg, 'x')})`, `PEG > 2: you're overpaying for growth (${fmt(peg, 'x')})`));
  const roe = cur('roe'), de = cur('debtToEquity');
  if (on('roe')) chk(roe == null ? null : roe < 10, tt(`ROE < 10%: el negocio no es eficiente con su capital (${fmt(roe, 'pct')})`, `ROE < 10%: the business isn't efficient with its capital (${fmt(roe, 'pct')})`));
  if (on('roe')) chk(roe == null || de == null ? null : roe > 25 && de > 1.5, tt('ROE alto + deuda/patrimonio alta = ROE inflado por deuda (trampa)', 'High ROE + high debt/equity = ROE inflated by debt (a trap)'));
  if (on('roe')) chk(ann('roe').length >= 4 ? decliningYears('roe', 3) : null, tt('ROE bajando año a año: posible MOAT debilitado', 'ROE declining year over year: possible weakening moat'));
  const dE = cur('debtToEbitda'); if (on('debtToEbitda')) chk(dE == null ? null : dE > 3, tt(`Deuda/EBITDA > 3x (${fmt(dE, 'x')}) — ${dE > 5 ? 'PELIGRO (> 5x)' : 'cuidado'}`, `Debt/EBITDA > 3x (${fmt(dE, 'x')}) — ${dE > 5 ? 'DANGER (> 5x)' : 'caution'}`));
  const fy = cur('fcfYield'); if (tp !== 'fastGrower' && on('fcfYield')) chk(fy == null ? null : fy < 2, fy != null && fy < 0 ? tt('FCF yield negativo: la empresa quema caja', 'Negative FCF yield: the company is burning cash') : tt(`FCF yield < 2%: pagás mucho por poco cash (${fmt(fy, 'pct')})`, `FCF yield < 2%: paying a lot for little cash (${fmt(fy, 'pct')})`));
  const po = cur('payoutRatio'); if (on('payoutRatio')) chk(po == null ? null : po > 80, tt(`Payout ratio > 80% (${fmt(po, 'pct')})`, `Payout ratio > 80% (${fmt(po, 'pct')})`));
  if (tp === 'slowGrower') { const dg2 = annGrowth('dividendsPerShare', P0); chk(dg2 == null ? null : dg2 <= 0, tt('Dividendo estancado o en baja (señal de venta para slow grower)', 'Dividend stalled or falling (sell signal for a slow grower)')); }
  if (tp === 'stalwart' && on('peRatio')) { const r = M('peRatio')?.rank3y; chk(r == null ? null : r >= 90, tt(`P/E muy estirado vs. su promedio histórico (percentil ${r ?? '—'})`, `P/E very stretched vs. its historical average (percentile ${r ?? '—'})`)); }
  if (tp === 'fastGrower') { const rgl2 = ann('revenueGrowth'); if (rgl2.length >= 2) chk(rgl2[rgl2.length - 1].v < rgl2[rgl2.length - 2].v - 5, tt('El crecimiento se está desacelerando', 'Growth is decelerating')); }
  return { hit, clean };
}

function buildChart(i) {
  const P = panels[i];
  const keys = P.sel.filter((k) => data.metrics[k] && hasSeries(k));
  const box = document.getElementById('box_' + i);
  if (!keys.length) { box.innerHTML = `<div class="loading">${tt('Agregá al menos una métrica.', 'Add at least one metric.')}</div>`; return; }
  box.innerHTML = `<canvas id="chart_${i}"></canvas>`;

  const set = new Set();
  keys.forEach((k) => series(k, P.mode).forEach((x) => set.add(x.p)));
  let labels = [...set].sort();
  const n = P.lookback[P.mode];
  if (n && labels.length > n) labels = labels.slice(-n);

  // ejes: métricas de la misma unidad comparten eje solo si su magnitud es parecida (dentro de 4×);
  // así PEG (~1) no queda aplastado contra un P/E (~30), ni la deuda/patrimonio contra el ratio corriente.
  const valsOf = (k) => { const map = new Map(series(k, P.mode).map((x) => [x.p, x.v])); return labels.map((l) => (map.has(l) ? map.get(l) : null)); };
  const mag = (k) => { const v = valsOf(k).filter((x) => x != null).map(Math.abs).sort((a, b) => a - b); return v.length ? v[Math.floor(v.length / 2)] || 1e-9 : 1e-9; };
  const axisOf = {}; const axes = [];
  keys.forEach((k) => {
    const u = data.metrics[k].unit, mg = mag(k);
    let ax = axes.find((a) => a.unit === u && Math.max(a.mag, mg) / Math.min(a.mag, mg) <= 4);
    if (!ax) { ax = { id: 'y' + axes.length, unit: u, mag: mg, keys: [] }; axes.push(ax); }
    ax.keys.push(k); axisOf[k] = ax.id;
  });

  const datasets = [];
  const scales = { x: { ticks: { color: '#8b8f99', maxRotation: 0, autoSkip: true }, grid: { color: '#262a33' }, stacked: false } };
  keys.forEach((k, idx) => {
    const m = data.metrics[k];
    const color = COLORS[P.sel.indexOf(k) % COLORS.length];
    const axis = axisOf[k];
    const vals = valsOf(k);
    const isBar = (P.types || {})[k] === 'bar';
    datasets.push({ label: mLabel(k), _k: k, data: vals, yAxisID: axis, borderColor: color, backgroundColor: isBar ? color + 'cc' : color,
      type: isBar ? 'bar' : 'line', borderWidth: 2, pointRadius: isBar ? 0 : 3, tension: 0.2, spanGaps: true, order: isBar ? 3 : 1,
      stack: 'stack' + idx, categoryPercentage: 0.7, barPercentage: 0.85 });
    if (P.avg) {
      const w = P.mode === 'annual' ? 3 : 4;
      const ma = vals.map((_, j) => {
        const win = vals.slice(Math.max(0, j - w + 1), j + 1).filter((v) => v != null);
        return win.length >= 2 ? win.reduce((a, b) => a + b, 0) / win.length : null;
      });
      datasets.push({ label: mLabel(k) + ' (' + tt('prom. móvil', 'moving avg') + ' ' + w + ')', _k: k, _ma: true, data: ma, yAxisID: axis, type: 'line', borderColor: color, borderDash: [7, 5], borderWidth: 1.2, pointRadius: 0, tension: 0.3, spanGaps: true, order: 0 });
    }
  });
  axes.forEach((a, j) => {
    const single = a.keys.length === 1;
    const c = single ? COLORS[P.sel.indexOf(a.keys[0]) % COLORS.length] : '#8b8f99';
    scales[a.id] = {
      type: 'linear', position: j === 0 ? 'left' : 'right',
      ticks: { color: c, callback: (v) => fmt(v, a.unit) },
      grid: { color: '#262a33', drawOnChartArea: j === 0 },
      title: { display: axes.length > 1, text: single ? mLabel(a.keys[0]) : a.keys.map((k) => mLabel(k)).join(' / '), color: c },
    };
  });

  charts[i] = new Chart(document.getElementById('chart_' + i).getContext('2d'), {
    data: { labels: labels.map((l) => (P.mode === 'annual' ? l : l.slice(2, 7).replace('-', '/'))), datasets },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#8b8f99', boxWidth: 10, font: { size: 11 } } },
        tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + fmt(c.parsed.y, data.metrics[c.dataset._k]?.unit) } },
      },
      scales,
    },
  });
}

        <div class="lynch-row"><span class="lynch-badge">${esc(TYPES[data.lynch?.type]?.[LANG]?.name || data.lynch?.label || '—')}</span>
          <select id="lynchSel" title="${esc(tt(UI.lynchTitle[0], UI.lynchTitle[1]))}"><option value="" ${data.lynch?.forced ? '' : 'selected'}>${tt(UI.auto[0], UI.auto[1])}</option>${lynchOpts}</select></div>
      </div>
      <div class="score-ring"><div class="score-num" style="color:${scoreColor}">${sc.total ?? '—'}</div><div class="score-label">${tt(UI.scoreLabel[0], UI.scoreLabel[1])} · ${sc.included} ${tt(UI.scoreOf[0], UI.scoreOf[1])} ${sc.of} ${tt(UI.metricsWord[0], UI.metricsWord[1])}</div>${sc.included < 8 ? `<div class="score-warn" title="${esc(tt(UI.lowDataTip[0], UI.lowDataTip[1]))}">${tt(UI.lowDataWarn[0], UI.lowDataWarn[1])}</div>` : ''}</div>
      <div><div class="price-big">${data.price != null ? data.price.toFixed(2) : '—'}</div><div class="muted" style="text-align:right">${esc(data.currency || '')}</div></div>
    </div>
    <div class="score-detail">${sc.groups.map((g) => `<span>${g.name}: <b style="color:${g.v == null ? '#8b8f99' : favColor(g.v)}">${g.v ?? '—'}</b></span>`).join('')}
      ${touched ? `<button class="reset" data-act="reset" title="${esc(tt(UI.resetEyesTip[0], UI.resetEyesTip[1]))}">${tt(UI.resetEyes[0], UI.resetEyes[1])}</button>` : ''}</div>
  </div>

  ${guideHtml()}

  <div class="panel">
    <p class="cards-title">${tt(UI.cardsTitleA[0], UI.cardsTitleA[1])} <span style="color:#2F9E44">${tt(UI.favorable[0], UI.favorable[1])}</span> = ${tt(UI.favorable[0], UI.favorable[1])}, <span style="color:#E03131">${tt(UI.unfavorable[0], UI.unfavorable[1])}</span> = ${tt(UI.unfavorable[0], UI.unfavorable[1])} ${tt(UI.cardsTitleB[0], UI.cardsTitleB[1])} <b>${tt(UI.borderWord[0], UI.borderWord[1])}</b> ${tt(UI.cardsTitleC[0], UI.cardsTitleC[1])} <b>${tt(UI.eyeWord[0], UI.eyeWord[1])}</b> ${tt(UI.cardsTitleD[0], UI.cardsTitleD[1])} <b>${tt(UI.activeChart[0], UI.activeChart[1])}</b>.
      <button class="collapse-all" data-act="collapseall" style="margin-left:8px;">${anyCollapsed ? tt(UI.expandAll[0], UI.expandAll[1]) : tt(UI.collapseAll[0], UI.collapseAll[1])}</button></p>
    <div id="cards">${cardsAndTabsHtml()}</div>
  </div>

  <div id="panels">${panels.map(panelHtml).join('')}</div>
  ${panels.length < MAX_PANELS ? `<button class="addpanel" data-act="addpanel">${tt(UI.addChart[0], UI.addChart[1])}</button>` : ''}`;

  panels.forEach((_, i) => buildChart(i));
}

// ---------- eventos (delegados) ----------
document.getElementById('content').addEventListener('click', (e) => {
  if (!data || data.error || data.history?.source === 'yahoo_price_only') return;
  const t = e.target;
  const btn = t.closest('[data-act]');
  const act = btn?.dataset.act;
  if (act === 'eye') { e.stopPropagation(); toggleMetric(btn.dataset.k); return; }
  if (act === 'grp') { e.stopPropagation(); toggleGroup(btn.dataset.cat); return; }
  if (act === 'collapse') { toggleCollapse(btn.dataset.cat); return; }
  if (act === 'collapseall') { const any = byCategory(() => true).some(([cat]) => collapsed[cat]); setAllCollapsed(!any); return; }
  if (act === 'reset') { delete excl[data.symbol]; store.set('fund_excl', excl); render(); return; }
  const i = Number(btn?.dataset.i);
  if (act === 'mode') { panels[i].mode = btn.dataset.v; active = i; savePanels(); render(); return; }
  if (act === 'lb') { panels[i].lookback[panels[i].mode] = Number(btn.dataset.v); active = i; savePanels(); render(); return; }
  if (act === 'typechip') { e.stopPropagation(); const P = panels[i]; P.types = P.types || {}; P.types[btn.dataset.k] = P.types[btn.dataset.k] === 'bar' ? 'line' : 'bar'; active = i; savePanels(); render(); return; }
  if (act === 'rmchip') { panels[i].sel = panels[i].sel.filter((k) => k !== btn.dataset.k); active = i; savePanels(); render(); return; }
  if (act === 'rmpanel') { panels.splice(i, 1); active = Math.min(active, panels.length - 1); savePanels(); render(); return; }
  if (act === 'addpanel') { panels.push(newPanel(['peRatio'].filter((k) => hasSeries(k)))); active = panels.length - 1; savePanels(); render(); return; }
  if (act) return; // selects / checkbox se manejan en 'change'
  const card = t.closest('.metric');
  if (card) {
    const k = card.dataset.key;
    if (!hasSeries(k)) return;
    const P = panels[active];
    P.sel = P.sel.includes(k) ? P.sel.filter((x) => x !== k) : [...P.sel, k].slice(-MAX_PER_PANEL);
    savePanels(); render(); return;
  }
  const panelEl = t.closest('.chart-panel');
  if (panelEl) { const pi = Number(panelEl.dataset.i); if (pi !== active) { active = pi; refreshSelection(); } }
});
document.getElementById('content').addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'lynchSel') { search(data.symbol, t.value); return; }
  const i = Number(t.dataset?.i);
  if (t.dataset?.act === 'add' && t.value) { const P = panels[i]; P.sel = [...P.sel, t.value].slice(-MAX_PER_PANEL); active = i; savePanels(); render(); }
  else if (t.dataset?.act === 'avg') { panels[i].avg = t.checked; savePanels(); render(); }
});
function refreshSelection() {
  document.querySelectorAll('.chart-panel').forEach((el) => el.classList.toggle('active', Number(el.dataset.i) === active));
  const act = panels[active]?.sel || [];
  document.querySelectorAll('.metric').forEach((el) => el.classList.toggle('sel', act.includes(el.dataset.key)));
}


// ---------- técnicos (RSI 14 y MACD 12/26/9) calculados del historial de precio diario ----------
function computeEMA(vals, period) {
  const k = 2 / (period + 1);
  const out = [];
  let ema = null;
  vals.forEach((v) => { ema = ema == null ? v : v * k + ema * (1 - k); out.push(ema); });
  return out;
}
function computeRSI14(closes) {
  if (closes.length < 15) return null;
  let gains = 0, losses = 0;
  for (let i = 1; i <= 14; i++) { const d = closes[i] - closes[i - 1]; if (d >= 0) gains += d; else losses -= d; }
  let avgGain = gains / 14, avgLoss = losses / 14;
  for (let i = 15; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    avgGain = (avgGain * 13 + Math.max(d, 0)) / 14;
    avgLoss = (avgLoss * 13 + Math.max(-d, 0)) / 14;
  }
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - 100 / (1 + rs);
}
function computeMACD(closes) {
  if (closes.length < 35) return { macd: null, signal: null };
  const ema12 = computeEMA(closes, 12), ema26 = computeEMA(closes, 26);
  const macdLine = closes.map((_, i) => ema12[i] - ema26[i]);
  const signalLine = computeEMA(macdLine.slice(25), 9); // el MACD solo es válido desde que ambas EMA existen
  return { macd: macdLine[macdLine.length - 1], signal: signalLine[signalLine.length - 1] };
}
function attachTechnicals(d) {
  const closes = (d.history?.price || []).map((p) => p.c).filter((c) => c != null);
  const rsi = computeRSI14(closes);
  const { macd, signal } = computeMACD(closes);
  const empty = { annual: [], quarterly: [] };
  d.metrics.rsi14 = { label: 'RSI (14)', category: 'Técnico', unit: 'num', dir: 0, current: rsi == null ? null : round2(rsi), rank3y: null, avg3y: null, note: 'RSI de 14 períodos sobre el precio de cierre diario. ≤35 sobrevendido, 35–70 neutral, >70 sobrecomprado.', ...empty };
  d.metrics.macd = { label: 'MACD', category: 'Técnico', unit: 'num', dir: 0, current: macd == null ? null : round2(macd), rank3y: null, avg3y: null, note: 'MACD (12, 26, 9) sobre el precio de cierre diario. MACD > señal: alcista. MACD < señal: bajista.', ...empty };
  d.metrics.macdSignal = { label: 'MACD Signal', category: 'Técnico', unit: 'num', dir: 0, current: signal == null ? null : round2(signal), rank3y: null, avg3y: null, ...empty, hidden: true };
}
function round2(v) { return Math.round(v * 100) / 100; }

async function search(symOverride, lynch) {
  const sym = (symOverride || document.getElementById('tickerInput').value || '').trim().toUpperCase();
  if (!sym) return;
  document.getElementById('tickerInput').value = sym;
  document.getElementById('content').innerHTML = `<div class="loading">${tt(UI.loading[0], UI.loading[1])}</div>`;
  try {
    const r = await fetch(`/api/fundamentals?symbol=${encodeURIComponent(sym)}` + (lynch ? `&lynch=${encodeURIComponent(lynch)}` : ''));
    data = await r.json();
    if (!data.error && data.metrics) attachTechnicals(data);
    render();
    if (!data.error) {
      recent = [sym, ...recent.filter((s) => s !== sym)].slice(0, 10);
      store.set('fund_recent', recent);
      renderRecent();
    }
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="loading">${tt(UI.errorPrefix[0], UI.errorPrefix[1])} ${esc(e.message)}</div>`;
  }
}

// ---------- idioma ----------
function applyStaticText() {
  document.documentElement.lang = LANG;
  document.title = tt(UI.pageTitle[0], UI.pageTitle[1]);
  document.getElementById('hTitle').textContent = tt(UI.hTitle[0], UI.hTitle[1]);
  Object.entries(NAV_T).forEach(([id, [es, en]]) => { const el = document.getElementById(id); if (el) el.textContent = tt(es, en); });
  document.getElementById('searchBtn').textContent = tt(UI.searchBtn[0], UI.searchBtn[1]);
  document.getElementById('tickerInput').placeholder = 'AAPL';
  const empty = document.getElementById('emptyMsg');
  if (empty) empty.textContent = tt(UI.emptyMsg[0], UI.emptyMsg[1]);
  document.getElementById('langEs').classList.toggle('on', LANG === 'es');
  document.getElementById('langEn').classList.toggle('on', LANG === 'en');
}
function setLang(l) {
  if (l === LANG) return;
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  applyStaticText();
  if (data) render();
}
document.getElementById('langEs').onclick = () => setLang('es');
document.getElementById('langEn').onclick = () => setLang('en');

document.getElementById('searchBtn').onclick = () => search();
document.getElementById('tickerInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
applyStaticText();
renderRecent();
const qs = new URLSearchParams(location.search).get('symbol');
if (qs) search(qs);
</script>
