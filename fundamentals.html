<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Análisis Fundamental</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262a33; --text:#e6e8eb; --muted:#8b8f99; --accent:#4C6EF5; --green:#2F9E44; --red:#E03131; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1 { font-size:18px; margin:0; }
  nav a { color:var(--muted); text-decoration:none; margin-left:16px; font-size:14px; }
  nav a:hover, nav a.active { color:var(--text); }
  .container { padding:20px; max-width:1200px; margin:0 auto; }
  .search-row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  input[type=text] { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:9px 14px; border-radius:8px; font-size:14px; width:140px; text-transform:uppercase; }
  button, select { font-family:inherit; }
  button.primary { background:var(--accent); color:#fff; border:none; padding:9px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
  .recent { display:flex; gap:6px; flex-wrap:wrap; }
  .recent button { background:var(--panel); border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
  .recent button:hover { color:var(--text); }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px; }
  .header-row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .company-name { font-size:22px; font-weight:600; }
  .company-sub, .muted { color:var(--muted); font-size:13px; }
  .lynch-row { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .lynch-badge { display:inline-block; background:#232838; border:1px solid var(--border); border-radius:999px; padding:3px 12px; font-size:12px; }
  select { background:#12151b; border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:8px; font-size:13px; }
  .score-ring { text-align:center; }
  .score-num { font-size:34px; font-weight:700; line-height:1; }
  .score-label { font-size:11px; color:var(--muted); margin-top:4px; }
  .price-big { font-size:26px; font-weight:600; text-align:right; }
  .score-detail { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .score-detail span { font-size:12px; color:var(--muted); background:#12151b; border:1px solid var(--border); border-radius:6px; padding:3px 8px; }
  .cards-title { font-size:12px; color:var(--muted); margin:0 0 10px; }
  .metrics-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .metric { background:#12151b; border:1px solid var(--border); border-left:4px solid #3a3f4b; border-radius:8px; padding:10px 12px; cursor:pointer; transition:background .15s; }
  .metric:hover { background:#161a22; }
  .metric.good { border-left-color:var(--green); }
  .metric.bad { border-left-color:var(--red); }
  .metric.sel { outline:1px solid var(--accent); }
  .metric .k { font-size:11px; color:var(--muted); }
  .metric .v { font-size:18px; font-weight:600; margin-top:2px; }
  .metric .d { font-size:11px; margin-top:2px; color:var(--muted); min-height:14px; }
  .metric.good .d { color:#69db7c; }
  .metric.bad .d { color:#ff8787; }
  .controls { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; margin-bottom:14px; }
  .controls label.lbl { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button { background:#12151b; color:var(--muted); border:none; padding:6px 12px; font-size:12px; cursor:pointer; border-right:1px solid var(--border); }
  .seg button:last-child { border-right:none; }
  .seg button.on { background:var(--accent); color:#fff; }
  .toggle { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .chart-wrap { position:relative; height:380px; }
  .loading { color:var(--muted); padding:40px; text-align:center; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; }
  @media (max-width:640px) { .chart-wrap { height:300px; } .price-big { text-align:left; } }
  .cat { margin-bottom:14px; } .cat:last-child { margin-bottom:0; }
  .cat-title { font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; padding-bottom:5px; border-bottom:1px solid var(--border); }
  .chart-panel.active { border-color:var(--accent); }
  .ptitle { font-size:12px; font-weight:600; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#12151b; border:1px solid var(--border); border-radius:999px; padding:3px 6px 3px 10px; font-size:12px; }
  .chip .x { background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 4px; }
  .chip .x:hover { color:#ff8787; }
  .rm { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:5px 9px; cursor:pointer; margin-left:auto; }
  .rm:hover { color:#ff8787; border-color:#ff8787; }
  .addpanel { width:100%; background:transparent; border:1px dashed var(--border); color:var(--muted); padding:14px; border-radius:12px; cursor:pointer; font-size:14px; margin-bottom:16px; }
  .addpanel:hover { color:var(--text); border-color:var(--accent); }
  .footnote { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5; }
  .footnote div { margin-top:3px; }
  .metric { position:relative; }
  .metric .eye { position:absolute; top:6px; right:6px; background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; border-radius:6px; line-height:0; }
  .metric .eye:hover { color:var(--text); background:#232838; }
  .metric.off { opacity:.38; filter:grayscale(.8); }
  .metric.off .k { text-decoration:line-through; }
  .metric.nodata { opacity:.3; cursor:default; }
  .metric .wt { color:#F59F00; font-size:11px; }
  .metric .k { padding-right:20px; }
  .rank { position:relative; height:18px; margin-top:8px; }
  .rank .track { position:absolute; left:0; right:0; top:8px; height:3px; border-radius:2px; background:#2a2f3a; }
  .rank .dot { position:absolute; top:0; transform:translateX(-50%); min-width:20px; height:18px; border-radius:9px; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .rank.none { height:0; margin:0; }
  .cat-title { display:flex; align-items:center; justify-content:space-between; }
  .cat-title .grp { background:none; border:none; color:var(--muted); cursor:pointer; padding:2px 4px; border-radius:6px; line-height:0; }
  .cat-title .grp:hover { color:var(--text); background:#232838; }
  .reset { background:none; border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; }
  .reset:hover { color:var(--text); }
  .guide-head { margin-bottom:12px; font-size:15px; }
  .guide-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  .gt { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:6px; }
  .gl { font-size:13px; line-height:1.45; margin-bottom:4px; }
  .ck { display:inline-block; width:16px; text-align:center; font-weight:700; }
  .ck.ok { color:#69db7c; } .ck.no { color:#ff8787; } .ck.na { color:#8b8f99; }
  .score-warn { font-size:11px; color:#F59F00; margin-top:4px; max-width:190px; }
  .dot2 { display:inline-block; width:9px; height:9px; border-radius:50%; }
</style>
</head>
<body>
<header>
  <h1>🔎 Análisis Fundamental</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/rotation.html">RRG</a>
    <a href="/rotation-stocks.html">RRG Acciones</a>
    <a href="/fundamentals.html" class="active">Fundamental</a>
    <a href="/watchlist.html">Watchlist</a>
  </nav>
</header>

<div class="container">
  <div class="search-row">
    <input type="text" id="tickerInput" placeholder="AAPL" maxlength="8" />
    <button class="primary" id="searchBtn">Buscar</button>
    <div class="recent" id="recentList"></div>
  </div>
  <div id="content"><div class="loading">Buscá un ticker (ej: AAPL, MSFT, KO, NVDA) para ver su análisis fundamental.</div></div>
</div>

<script>
const COLORS = ['#4C6EF5', '#F59F00', '#2F9E44', '#E64980', '#AE3EC9', '#20C997'];
const CAT_ORDER = ['Valuación · Múltiplos', 'Valuación · Yields', 'Márgenes', 'Rentabilidad', 'Crecimiento', 'Dividendos', 'Solvencia', 'Caja', 'Resultados', 'Balance'];
const UNIT_NAME = { usd: 'USD', usdps: 'USD/acción', pct: '%', x: '×' };
const MAX_PER_PANEL = 4, MAX_PANELS = 4;
// Agrupación para las barras del score
const SCORE_GROUPS = [
  ['Valuación', ['Valuación · Múltiplos', 'Valuación · Yields']],
  ['Calidad', ['Márgenes', 'Rentabilidad']],
  ['Crecimiento', ['Crecimiento']],
  ['Solvencia', ['Solvencia']],
  ['Dividendos', ['Dividendos']],
];

// ---------- Perfiles por tipo de acción (apuntes ACCIONES_ANALISIS) ----------
// w: peso de cada métrica en el score (1 por defecto) · off: métricas que arrancan tapadas (se pueden destapar con el ojito)
const TYPES = {
  slowGrower: {
    name: 'Slow Grower', ej: 'KO, PEP, PG, T', desc: 'Empresas aburridas pero estables',
    crec: '2–4% anual', div: 'Altos y estables', riesgo: 'Muy bajo',
    comprar: 'Cuando el dividend yield está en máximos históricos (precio bajo).',
    vender: 'Cuando el dividendo se estanca o el payout supera 80%: no saben en qué invertir y devuelven la plata.',
    ideales: 'Dividend yield 3–6% · Payout que no supere 60–70%',
    w: { dividendYield: 3, payoutRatio: 3, fcfYield: 2, shareholderYield: 2, fcfEvYield: 1.5, debtToEbitda: 1.5, netDebtToEbitda: 1.5, peRatio: 1.5 },
    off: ['peg', 'revenueGrowth', 'epsGrowth', 'psForward', 'evSalesFwd', 'psRatio', 'evSales', 'pgpRatio', 'evGp'],
  },
  stalwart: {
    name: 'Stalwart', ej: 'JNJ, AAPL, V, WMT, MCD', desc: 'Soldados confiables',
    crec: '8–12% anual', div: 'Moderados, crecientes', riesgo: 'Bajo–medio (beta 0,8–1,2)',
    comprar: 'Cuando caen 10–20% por motivos ajenos al negocio (coyuntura, guerra).',
    vender: 'Cuando el P/E se estira mucho vs su promedio histórico, o el crecimiento frena.',
    ideales: 'P/E vs promedio histórico · Crecimiento de ganancias estable',
    w: { peRatio: 3, peForward: 1.5, epsGrowth: 2, peg: 1.5, roe: 1.5, opMargin: 1.5, fcfYield: 1 },
    off: [],
  },
  fastGrower: {
    name: 'Fast Grower', ej: 'MELI, NU, NVDA, META, TSLA', desc: 'Las que hacen la diferencia',
    crec: '20–50% anual', div: 'Bajos o nulos', riesgo: 'Alto',
    comprar: 'Cuando el PEG está por debajo de 1 (barata). En 1 el precio es justo.',
    vender: 'Cuando el crecimiento se desacelera, el PEG supera 2 o se rompe la tesis de inversión.',
    ideales: 'PEG < 1 · Crecimiento de ingresos > 20% sostenido',
    w: { peg: 3, revenueGrowth: 3, epsGrowth: 2, opMargin: 1.5, grossMargin: 1.5, roic: 1.5 },
    off: ['dividendYield', 'payoutRatio', 'dividendsPerShare', 'shareholderYield', 'shareholderYieldExDebt', 'buybackYield', 'debtPaybackYield', 'fcfYield', 'fcfEvYield', 'pbRatio', 'ptbvRatio'],
  },
  cyclical: {
    name: 'Cíclica', ej: 'YPF, XOM, BAC, aerolíneas, autos, acero', desc: 'Suben y bajan con la economía. El timing es todo',
    crec: 'Variable, −20% a +40%', div: 'Variables', riesgo: 'Alto',
    comprar: 'Al final de una recesión, cuando nadie las quiere: ahí el P/E es ALTO (ganancias en el piso).',
    vender: 'Cuando la economía está en su pico y todo el mundo es optimista: ahí el P/E es BAJO (peligro).',
    ideales: 'P/E invertido: P/E bajo = peligro (pico del ciclo), P/E alto = oportunidad (piso del ciclo)',
    invert: ['peRatio', 'evEbit', 'evEbitda'],
    w: { peRatio: 3, debtToEbitda: 2, netDebtToEbitda: 2, altmanZ: 1.5, currentRatio: 1.5 },
    off: ['peg', 'epsGrowth', 'psForward', 'evSalesFwd'],
  },
  turnaround: {
    name: 'Turnaround', ej: 'NKE, INTC, PYPL, ADBE, DUOL', desc: 'Empresas en problemas que pueden resurgir. Alto riesgo, alta recompensa',
    crec: 'De negativo a positivo', div: 'Nulos', riesgo: 'Muy alto',
    comprar: 'Cuando tiene caja para sobrevivir y un plan de reestructuración creíble.',
    vender: 'Cuando el turnaround se completó y el precio ya refleja la recuperación.',
    ideales: 'Caja y deuda: que pueda sobrevivir 18 meses · Plan de reestructuración concreto',
    w: { currentRatio: 2.5, altmanZ: 2.5, debtToEbitda: 2, netDebtToEbitda: 2, ltDebtToEquity: 1.5, debtToCapital: 1.5, fcfYield: 1.5 },
    off: ['dividendYield', 'payoutRatio', 'dividendsPerShare', 'shareholderYield', 'shareholderYieldExDebt', 'peg'],
  },
  assetPlay: {
    name: 'Asset Play', ej: 'IRSA, CRESUD, BRK.B', desc: 'Valen más de lo que el mercado cree por sus activos',
    crec: 'Variable', div: 'Variables', riesgo: 'Medio–alto',
    comprar: 'Cuando el valor de los activos (tierra, marcas, propiedades) supera la valuación.',
    vender: 'Cuando los activos se venden o el mercado reconoce el valor oculto.',
    ideales: 'Price/Book vs precio de mercado · ¿Cuánto valen los activos si se liquidan?',
    w: { pbRatio: 3, ptbvRatio: 3, debtToEquity: 1.5, altmanZ: 1.5 },
    off: ['peg', 'revenueGrowth', 'epsGrowth', 'psForward', 'evSalesFwd', 'peForward'],
  },
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const newPanel = (sel) => ({ sel, mode: 'annual', lookback: { annual: 5, quarterly: 8 }, avg: true });
function loadPanels() {
  const p = store.get('fund_panels', null);
  if (!Array.isArray(p) || !p.length) return [newPanel(['revenue', 'netMargin'])];
  return p.slice(0, MAX_PANELS).map((x) => ({
    sel: Array.isArray(x.sel) ? x.sel.slice(0, MAX_PER_PANEL) : [],
    mode: x.mode === 'quarterly' ? 'quarterly' : 'annual',
    lookback: { annual: Number(x.lookback?.annual ?? 5), quarterly: Number(x.lookback?.quarterly ?? 8) },
    avg: x.avg !== false,
  }));
}

let recent = store.get('fund_recent', []);
let panels = loadPanels();
let active = 0;
let data = null, charts = [];
let excl = store.get('fund_excl', {}); // { TICKER: [claves tapadas] } — solo si el usuario tocó algún ojito
const savePanels = () => store.set('fund_panels', panels);

// ---------- formato ----------
function fmtBig(v) {
  if (v == null) return '—';
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e12) return s + (a / 1e12).toFixed(2) + 'T';
  if (a >= 1e9) return s + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return s + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return s + (a / 1e3).toFixed(2) + 'K';
  return s + a.toFixed(2);
}
function fmt(v, unit) {
  if (v == null || !isFinite(v)) return '—';
  if (unit === 'usd') return fmtBig(v);
  if (unit === 'usdps') return '$' + v.toFixed(2);
  if (unit === 'pct') return v.toFixed(unit === 'pct' && Math.abs(v) < 10 ? 2 : 1) + '%';
  if (unit === 'x') return v.toFixed(2) + '×';
  return String(v);
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderRecent() {
  const w = document.getElementById('recentList');
  w.innerHTML = '';
  recent.slice(0, 8).forEach((sym) => {
    const b = document.createElement('button');
    b.textContent = sym;
    b.onclick = () => { document.getElementById('tickerInput').value = sym; search(sym); };
    w.appendChild(b);
  });
}

// ---------- helpers de datos ----------
const catRank = (c) => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };
const M = (k) => data.metrics[k];
const cur = (k) => (data.metrics[k] ? data.metrics[k].current : null);
function hasSeries(key) { const m = data.metrics[key]; return !!m && (m.annual.some((x) => x.v != null) || m.quarterly.some((x) => x.v != null)); }
function series(key, mode) { return (data.metrics[key] && data.metrics[key][mode]) || []; }
function ann(key) { return series(key, 'annual').filter((x) => x.v != null); }
function byCategory(filterFn) {
  const groups = {};
  Object.entries(data.metrics).forEach(([k, m]) => { if (filterFn(k, m)) (groups[m.category] = groups[m.category] || []).push(k); });
  return Object.keys(groups).sort((a, b) => catRank(a) - catRank(b)).map((c) => [c, groups[c]]);
}
const typeKey = () => data.lynch?.type || 'stalwart';
const T = () => TYPES[typeKey()] || TYPES.stalwart;
// ¿La métrica participa en el score? (ratios con dirección; las cifras absolutas no)
const scorable = (k) => { const m = M(k); return m && (m.unit === 'pct' || m.unit === 'x') && m.dir !== 0; };
// dirección efectiva (las cíclicas invierten el P/E y los múltiplos de ganancias)
const dirEff = (k) => (T().invert && T().invert.includes(k) ? -M(k).dir : M(k).dir);

// ---------- ojito: métricas tapadas ----------
function defaultExcluded() {
  const set = new Set(T().off || []);
  Object.keys(data.metrics).forEach((k) => { if (data.metrics[k].current == null) set.add(k); });
  return set;
}
function excludedSet() { return excl[data.symbol] ? new Set(excl[data.symbol]) : defaultExcluded(); }
function saveExcluded(set) { excl[data.symbol] = [...set]; store.set('fund_excl', excl); }
function toggleMetric(k) { const s = excludedSet(); s.has(k) ? s.delete(k) : s.add(k); saveExcluded(s); render(); }
function toggleGroup(cat) {
  const keys = Object.keys(data.metrics).filter((k) => data.metrics[k].category === cat && data.metrics[k].current != null);
  const s = excludedSet();
  const allOff = keys.every((k) => s.has(k));
  keys.forEach((k) => (allOff ? s.delete(k) : s.add(k)));
  saveExcluded(s); render();
}

// ---------- scoring: percentil vs 3 años + reglas de los apuntes ----------
// favorabilidad 0-100 según el percentil (1 = más bajo, 100 = más alto) y la dirección de la métrica
function favRank(k) {
  const m = M(k); if (m.rank3y == null) return null;
  const d = dirEff(k);
  return d > 0 ? m.rank3y : d < 0 ? 100 - m.rank3y : null;
}
function slope(k, n) { const a = ann(k); if (a.length < n + 1) return null; return a[a.length - 1].v - a[a.length - 1 - n].v; }
// reglas de los apuntes (0-100) — null si no hay regla para esa métrica/tipo
function ruleScore(k) {
  const v = cur(k), t = typeKey();
  if (v == null) return null;
  switch (k) {
    case 'peRatio':
      if (v <= 0) return null;
      if (t === 'cyclical') return v < 10 ? 10 : v < 15 ? 35 : v < 25 ? 65 : 90;
      return v < 15 ? 100 : v < 25 ? 70 : v < 30 ? 45 : 20;
    case 'peg': return v <= 0 ? null : v < 1 ? 100 : v <= 1.5 ? 75 : v <= 2 ? 45 : 15;
    case 'roe': { const de = cur('debtToEquity'); if (v > 25 && de != null && de > 1.5) return 30; return v > 15 ? 100 : v >= 10 ? 60 : 20; }
    case 'roic': return v > 12 ? 100 : v >= 8 ? 55 : 20;
    case 'debtToEbitda': return v < 1 ? 100 : v < 2 ? 85 : v < 3 ? 60 : v < 5 ? 25 : 5;
    case 'netDebtToEbitda': return v < 0 ? 100 : v < 1 ? 100 : v < 2 ? 85 : v < 3 ? 60 : v < 5 ? 25 : 5;
    case 'fcfYield': return v > 8 ? 100 : v > 5 ? 85 : v >= 2 ? 55 : v >= 0 ? 25 : 0;
    case 'payoutRatio': return v <= 60 ? 100 : v <= 70 ? 75 : v <= 80 ? 40 : 10;
    case 'dividendYield': return t === 'slowGrower' ? (v >= 3 && v <= 6 ? 100 : v > 6 ? 70 : v >= 2 ? 60 : 25) : null;
    case 'opMargin': { const s = slope(k, 3); return s == null ? null : s >= 0 ? 85 : s > -3 ? 55 : 25; }
    case 'altmanZ': return v > 2.99 ? 100 : v >= 1.8 ? 50 : 10;
    case 'currentRatio': return v >= 1.5 ? 100 : v >= 1 ? 65 : 25;
    case 'pbRatio': return t === 'assetPlay' ? (v < 1 ? 100 : v < 1.5 ? 70 : v < 3 ? 40 : 15) : null;
    case 'revenueGrowth': {
      const a = ann(k); const g = a.length ? a[a.length - 1].v : null; if (g == null) return null;
      if (t === 'fastGrower') return g > 20 ? 100 : g >= 10 ? 60 : 20;
      if (t === 'stalwart') return g >= 8 ? 100 : g >= 4 ? 60 : 30;
      return null;
    }
    default: return null;
  }
}
function metricScore(k) {
  const f = favRank(k), r = ruleScore(k);
  if (f != null && r != null) return 0.5 * f + 0.5 * r;
  return r ?? f;
}
function computeScore() {
  const ex = excludedSet(), w = T().w || {};
  let num = 0, den = 0, included = 0, total = 0;
  const groups = SCORE_GROUPS.map(([name, cats]) => ({ name, cats, num: 0, den: 0 }));
  Object.keys(data.metrics).forEach((k) => {
    if (!scorable(k) || data.metrics[k].current == null) return;
    total++;
    if (ex.has(k)) return;
    const s = metricScore(k); if (s == null) return;
    const wt = w[k] ?? 1;
    num += s * wt; den += wt; included++;
    const g = groups.find((x) => x.cats.includes(data.metrics[k].category));
    if (g) { g.num += s * wt; g.den += wt; }
  });
  return { total: den ? Math.round(num / den) : null, included, of: total, groups: groups.map((g) => ({ name: g.name, v: g.den ? Math.round(g.num / g.den) : null })) };
}

// ---------- checklist de compra/venta y señales de alarma (apuntes) ----------
// crecimiento del ejercicio P vs. el anterior (mismo período para todas las métricas, así no se comparan años distintos)
function annVal(k, p) { const x = series(k, 'annual').find((y) => y.p === String(p)); return x && x.v != null ? x.v : null; }
function annGrowth(k, p) { const a = annVal(k, p), b = annVal(k, Number(p) - 1); return a != null && b ? (a / b - 1) * 100 : null; }
function decliningYears(k, n) { const a = ann(k); if (a.length < n + 1) return false; for (let i = a.length - n; i < a.length; i++) if (!(a[i].v < a[i - 1].v)) return false; return true; }
function drawdown12m() {
  const p = (data.history?.price || []).slice(-252).map((x) => x.c).filter((x) => x != null);
  if (p.length < 60) return null;
  const hi = Math.max(...p); return (p[p.length - 1] / hi - 1) * 100;
}
function buyChecks() {
  const t = typeKey(), out = [];
  const ok = (c, text) => out.push({ ok: c, text });
  if (t === 'slowGrower') {
    const r = M('dividendYield')?.rank3y;
    ok(r == null ? null : r >= 80, `Dividend yield en zona alta de su historia (percentil ${r ?? '—'}; actual ${fmt(cur('dividendYield'), 'pct')})`);
    const dy = cur('dividendYield'); ok(dy == null ? null : dy >= 3 && dy <= 6, `Dividend yield entre 3% y 6% (${fmt(dy, 'pct')})`);
    const po = cur('payoutRatio'); ok(po == null ? null : po <= 70, `Payout ratio ≤ 70% (${fmt(po, 'pct')})`);
  } else if (t === 'stalwart') {
    const dd = drawdown12m();
    ok(dd == null ? null : dd <= -10, `Caída de 10–20% vs. máximo de 12 meses por motivos ajenos al negocio (hoy ${dd == null ? '—' : dd.toFixed(1) + '%'})`);
    const r = M('peRatio')?.rank3y; ok(r == null ? null : r <= 40, `P/E en zona baja vs. su promedio histórico (percentil ${r ?? '—'})`);
    const g = ann('epsGrowth'); ok(g.length ? g[g.length - 1].v > 0 : null, 'Crecimiento de ganancias positivo y estable');
  } else if (t === 'fastGrower') {
    const peg = cur('peg'); ok(peg == null ? null : peg < 1, `PEG < 1 (${fmt(peg, 'x')})`);
    const a = ann('revenueGrowth'); const g = a.length ? a[a.length - 1].v : null; ok(g == null ? null : g > 20, `Crecimiento de ingresos > 20% sostenido (último año ${g == null ? '—' : g.toFixed(1) + '%'})`);
  } else if (t === 'cyclical') {
    const r = M('peRatio')?.rank3y; ok(r == null ? null : r >= 75, `P/E ALTO vs. su historia = ganancias en el piso del ciclo (percentil ${r ?? '—'})`);
    const nd = cur('netDebtToEbitda'); ok(nd == null ? null : nd < 3, `Deuda neta/EBITDA razonable para aguantar la recesión (${fmt(nd, 'x')})`);
  } else if (t === 'turnaround') {
    const cr = cur('currentRatio'); ok(cr == null ? null : cr >= 1.5, `Caja para sobrevivir: ratio corriente ≥ 1,5 (${fmt(cr, 'x')})`);
    const nd = cur('netDebtToEbitda'); ok(nd == null ? null : nd < 3, `Deuda neta/EBITDA < 3 (${fmt(nd, 'x')})`);
    const oc = cur('operatingCashFlow'); ok(oc == null ? null : oc > 0, 'Flujo operativo positivo');
    out.push({ ok: null, text: 'Plan de reestructuración concreto (revisar manualmente en el 10-K / conference calls)' });
  } else {
    const pb = cur('pbRatio'), tb = cur('ptbvRatio');
    ok(pb == null ? null : pb < 1, `Price/Book < 1 (${fmt(pb, 'x')})`);
    ok(tb == null ? null : tb < 1.5, `Price/Tangible Book < 1,5 (${fmt(tb, 'x')})`);
    out.push({ ok: null, text: '¿Cuánto valen los activos si se liquidan? (revisar manualmente)' });
  }
  return out;
}
// señales de alarma generales de los apuntes; devuelve solo las que se activaron y cuáles no se pudieron evaluar
function alarms() {
  const t = typeKey(), hit = [], clean = [];
  const ex = excludedSet(); // las métricas tapadas con el ojito tampoco disparan alarmas
  const on = (k) => !ex.has(k);
  const chk = (cond, text) => { if (cond === true) hit.push(text); else if (cond === false) clean.push(text); };
  const P0 = ann('revenue').at(-1)?.p;
  const rg = annGrowth('revenue', P0), fg = annGrowth('fcf', P0), dg = annGrowth('totalDebt', P0), ig = annGrowth('inventory', P0);
  chk(rg == null || fg == null ? null : rg > 0 && fg < 0, 'Ingresos crecen pero el FCF baja');
  chk(rg == null || dg == null ? null : dg > 0 && dg > rg + 1, `Deuda crece más rápido que los ingresos (deuda ${dg == null ? '—' : dg.toFixed(0) + '%'} vs ingresos ${rg == null ? '—' : rg.toFixed(0) + '%'})`);
  chk(ann('opMargin').length >= 4 ? decliningYears('opMargin', 3) : null, 'Margen operativo se achica año a año (3 años seguidos)');
  chk(rg == null || ig == null ? null : ig > rg && ig > 0, 'Inventario crece más que las ventas');
  const ni = annVal('netIncome', P0), oc = annVal('operatingCashFlow', P0);
  chk(ni == null || oc == null ? null : ni > 0 && oc / ni < 0.7, 'Ganancia neta alta pero flujo operativo bajo (< 70% de la ganancia)');
  const pe = cur('peRatio'), rgl = ann('revenueGrowth').at(-1)?.v;
  if (t !== 'cyclical' && on('peRatio')) chk(pe == null || rgl == null ? null : pe > 30 && rgl < 15, 'P/E > 30 sin crecimiento fuerte que lo justifique');
  const peg = cur('peg'); if (on('peg')) chk(peg == null ? null : peg > 2, `PEG > 2: estás pagando de más por el crecimiento (${fmt(peg, 'x')})`);
  const roe = cur('roe'), de = cur('debtToEquity');
  if (on('roe')) chk(roe == null ? null : roe < 10, `ROE < 10%: el negocio no es eficiente con su capital (${fmt(roe, 'pct')})`);
  if (on('roe')) chk(roe == null || de == null ? null : roe > 25 && de > 1.5, 'ROE alto + deuda/patrimonio alta = ROE inflado por deuda (trampa)');
  if (on('roe')) chk(ann('roe').length >= 4 ? decliningYears('roe', 3) : null, 'ROE bajando año a año: posible MOAT debilitado');
  const dE = cur('debtToEbitda'); if (on('debtToEbitda')) chk(dE == null ? null : dE > 3, `Deuda/EBITDA > 3x (${fmt(dE, 'x')}) — ${dE > 5 ? 'PELIGRO (> 5x)' : 'cuidado'}`);
  const fy = cur('fcfYield'); if (t !== 'fastGrower' && on('fcfYield')) chk(fy == null ? null : fy < 2, fy != null && fy < 0 ? 'FCF yield negativo: la empresa quema caja' : `FCF yield < 2%: pagás mucho por poco cash (${fmt(fy, 'pct')})`);
  const po = cur('payoutRatio'); if (on('payoutRatio')) chk(po == null ? null : po > 80, `Payout ratio > 80% (${fmt(po, 'pct')})`);
  if (t === 'slowGrower') { const dg2 = annGrowth('dividendsPerShare', P0); chk(dg2 == null ? null : dg2 <= 0, 'Dividendo estancado o en baja (señal de venta para slow grower)'); }
  if (t === 'stalwart' && on('peRatio')) { const r = M('peRatio')?.rank3y; chk(r == null ? null : r >= 90, `P/E muy estirado vs. su promedio histórico (percentil ${r ?? '—'})`); }
  if (t === 'fastGrower') { const rgl2 = ann('revenueGrowth'); if (rgl2.length >= 2) chk(rgl2[rgl2.length - 1].v < rgl2[rgl2.length - 2].v - 5, 'El crecimiento se está desacelerando'); }
  return { hit, clean };
}

function favColor(f) { return f == null ? '#6b7280' : f >= 70 ? '#2F9E44' : f <= 30 ? '#E03131' : '#9aa0aa'; }

const lookbackOptions = (mode) => (mode === 'annual' ? [3, 5, 10, 0] : [4, 8, 12, 0]);

// ---------- gráficos ----------
function buildChart(i) {
  const P = panels[i];
  const keys = P.sel.filter((k) => data.metrics[k] && hasSeries(k));
  const box = document.getElementById('box_' + i);
  if (!keys.length) { box.innerHTML = '<div class="loading">Agregá al menos una métrica.</div>'; return; }
  box.innerHTML = `<canvas id="chart_${i}"></canvas>`;

  const set = new Set();
  keys.forEach((k) => series(k, P.mode).forEach((x) => set.add(x.p)));
  let labels = [...set].sort();
  const n = P.lookback[P.mode];
  if (n && labels.length > n) labels = labels.slice(-n);

  // ejes: métricas de la misma unidad comparten eje solo si su magnitud es parecida (dentro de 4×);
  // así PEG (~1) no queda aplastado contra un P/E (~30), ni la deuda/patrimonio contra el ratio corriente.
  const valsOf = (k) => { const map = new Map(series(k, P.mode).map((x) => [x.p, x.v])); return labels.map((l) => (map.has(l) ? map.get(l) : null)); };
  const mag = (k) => { const v = valsOf(k).filter((x) => x != null).map(Math.abs).sort((a, b) => a - b); return v.length ? v[Math.floor(v.length / 2)] || 1e-9 : 1e-9; };
  const axisOf = {}; const axes = [];
  keys.forEach((k) => {
    const u = data.metrics[k].unit, mg = mag(k);
    let ax = axes.find((a) => a.unit === u && Math.max(a.mag, mg) / Math.min(a.mag, mg) <= 4);
    if (!ax) { ax = { id: 'y' + axes.length, unit: u, mag: mg, keys: [] }; axes.push(ax); }
    ax.keys.push(k); axisOf[k] = ax.id;
  });

  const datasets = [];
  const scales = { x: { ticks: { color: '#8b8f99', maxRotation: 0, autoSkip: true }, grid: { color: '#262a33' } } };
  keys.forEach((k, idx) => {
    const m = data.metrics[k];
    const color = COLORS[P.sel.indexOf(k) % COLORS.length];
    const axis = axisOf[k];
    const vals = valsOf(k);
    const isBar = idx === 0 && m.unit === 'usd';
    datasets.push({ label: m.label, _k: k, data: vals, yAxisID: axis, borderColor: color, backgroundColor: isBar ? color + 'cc' : color,
      type: isBar ? 'bar' : 'line', borderWidth: 2, pointRadius: 3, tension: 0.2, spanGaps: true, order: isBar ? 3 : 1 });
    if ((k === 'peForward' || k === 'peg') && m.current != null) {
      datasets.push({ label: m.label + ' actual', _k: k, data: labels.map(() => m.current), yAxisID: axis, type: 'line', borderColor: color, borderDash: [3, 4], borderWidth: 1.5, pointRadius: 0, order: 0 });
    }
    if (P.avg) {
      const w = P.mode === 'annual' ? 3 : 4;
      const ma = vals.map((_, j) => {
        const win = vals.slice(Math.max(0, j - w + 1), j + 1).filter((v) => v != null);
        return win.length >= 2 ? win.reduce((a, b) => a + b, 0) / win.length : null;
      });
      datasets.push({ label: m.label + ' (prom. móvil ' + w + ')', _k: k, _ma: true, data: ma, yAxisID: axis, type: 'line', borderColor: color, borderDash: [7, 5], borderWidth: 1.2, pointRadius: 0, tension: 0.3, spanGaps: true, order: 2 });
    }
  });
  axes.forEach((a, j) => {
    const single = a.keys.length === 1;
    const c = single ? COLORS[P.sel.indexOf(a.keys[0]) % COLORS.length] : '#8b8f99';
    scales[a.id] = {
      type: 'linear', position: j === 0 ? 'left' : 'right',
      ticks: { color: c, callback: (v) => fmt(v, a.unit) },
      grid: { color: '#262a33', drawOnChartArea: j === 0 },
      title: { display: axes.length > 1, text: single ? data.metrics[a.keys[0]].label : a.keys.map((k) => data.metrics[k].label).join(' / '), color: c },
    };
  });

  charts[i] = new Chart(document.getElementById('chart_' + i).getContext('2d'), {
    data: { labels: labels.map((l) => (P.mode === 'annual' ? l : l.slice(2, 7).replace('-', '/'))), datasets },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#8b8f99', boxWidth: 10, font: { size: 11 }, filter: (it) => !it.text.includes('prom. móvil') } },
        tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + fmt(c.parsed.y, data.metrics[c.dataset._k]?.unit) } },
      },
      scales,
    },
  });
}

      <div>
        <div class="company-name">${esc(data.name)} <span class="muted">${esc(data.symbol)}</span></div>
        <div class="company-sub">${esc(data.exchange || '')} · Market cap: ${fmtBig(data.marketCap)} ${esc(data.currency || '')} · Historial ${data.history.annualYears}a / ${data.history.quarterlyPeriods}t</div>
        <div class="lynch-row"><span class="lynch-badge">${esc(data.lynch?.label || '—')}</span>
          <select id="lynchSel" title="Clasificación Lynch (cambia el perfil de pesos y las reglas)"><option value="" ${data.lynch?.forced ? '' : 'selected'}>Auto</option>${lynchOpts}</select></div>
      </div>
      <div class="score-ring"><div class="score-num" style="color:${scoreColor}">${sc.total ?? '—'}</div><div class="score-label">Score · ${sc.included} de ${sc.of} métricas</div>${sc.included < 8 ? '<div class="score-warn" title="La SEC devuelve pocos datos históricos de esta empresa, así que el score se apoya en muy pocas métricas">⚠ pocos datos: score poco confiable</div>' : ''}</div>
      <div><div class="price-big">${data.price != null ? data.price.toFixed(2) : '—'}</div><div class="muted" style="text-align:right">${esc(data.currency || '')}</div></div>
    </div>
    <div class="score-detail">${sc.groups.map((g) => `<span>${g.name}: <b style="color:${g.v == null ? '#8b8f99' : favColor(g.v)}">${g.v ?? '—'}</b></span>`).join('')}
      ${touched ? '<button class="reset" data-act="reset" title="Vuelve a las métricas tapadas por defecto para este tipo de acción">↺ Restablecer ojitos</button>' : ''}</div>
  </div>

  ${guideHtml()}

  <div class="panel">
    <p class="cards-title">La bolita muestra dónde está la métrica hoy vs. sus últimos 3 años (1 = mínimo, 100 = máximo): <span style="color:#2F9E44">verde</span> = favorable, <span style="color:#E03131">rojo</span> = desfavorable (para métricas donde menos es mejor, como P/E o deuda, el mínimo es favorable). El <b>borde</b> de la tarjeta mezcla ese historial con las reglas de tus apuntes (ej.: PEG &lt; 1, deuda/EBITDA &lt; 2x). El <b>ojito</b> tapa una métrica para que no cuente en el score (★ = clave para este tipo de acción). Click en la tarjeta para graficarla en el <b>gráfico activo</b>.</p>
    <div id="cards">${cardsHtml()}</div>
  </div>

  <div id="panels">${panels.map(panelHtml).join('')}</div>
  ${panels.length < MAX_PANELS ? '<button class="addpanel" data-act="addpanel">+ Agregar gráfico</button>' : ''}`;

  panels.forEach((_, i) => buildChart(i));
}

// ---------- eventos (delegados) ----------
document.getElementById('content').addEventListener('click', (e) => {
  if (!data || data.error || data.history?.source === 'yahoo_price_only') return;
  const t = e.target;
  const btn = t.closest('[data-act]');
  const act = btn?.dataset.act;
  if (act === 'eye') { e.stopPropagation(); toggleMetric(btn.dataset.k); return; }
  if (act === 'grp') { toggleGroup(btn.dataset.cat); return; }
  if (act === 'reset') { delete excl[data.symbol]; store.set('fund_excl', excl); render(); return; }
  const i = Number(btn?.dataset.i);
  if (act === 'mode') { panels[i].mode = btn.dataset.v; active = i; savePanels(); render(); return; }
  if (act === 'lb') { panels[i].lookback[panels[i].mode] = Number(btn.dataset.v); active = i; savePanels(); render(); return; }
  if (act === 'rmchip') { panels[i].sel = panels[i].sel.filter((k) => k !== btn.dataset.k); active = i; savePanels(); render(); return; }
  if (act === 'rmpanel') { panels.splice(i, 1); active = Math.min(active, panels.length - 1); savePanels(); render(); return; }
  if (act === 'addpanel') { panels.push(newPanel(['peRatio'].filter((k) => hasSeries(k)))); active = panels.length - 1; savePanels(); render(); return; }
  if (act) return; // selects / checkbox se manejan en 'change'
  const card = t.closest('.metric');
  if (card) {
    const k = card.dataset.key;
    if (!hasSeries(k)) return;
    const P = panels[active];
    P.sel = P.sel.includes(k) ? P.sel.filter((x) => x !== k) : [...P.sel, k].slice(-MAX_PER_PANEL);
    savePanels(); render(); return;
  }
  const panelEl = t.closest('.chart-panel');
  if (panelEl) { const pi = Number(panelEl.dataset.i); if (pi !== active) { active = pi; refreshSelection(); } }
});
document.getElementById('content').addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'lynchSel') { search(data.symbol, t.value); return; }
  const i = Number(t.dataset?.i);
  if (t.dataset?.act === 'add' && t.value) { const P = panels[i]; P.sel = [...P.sel, t.value].slice(-MAX_PER_PANEL); active = i; savePanels(); render(); }
  else if (t.dataset?.act === 'avg') { panels[i].avg = t.checked; savePanels(); render(); }
});
function refreshSelection() {
  document.querySelectorAll('.chart-panel').forEach((el) => el.classList.toggle('active', Number(el.dataset.i) === active));
  const act = panels[active]?.sel || [];
  document.querySelectorAll('.metric').forEach((el) => el.classList.toggle('sel', act.includes(el.dataset.key)));
}

async function search(symOverride, lynch) {
  const sym = (symOverride || document.getElementById('tickerInput').value || '').trim().toUpperCase();
  if (!sym) return;
  document.getElementById('tickerInput').value = sym;
  document.getElementById('content').innerHTML = '<div class="loading">Cargando…</div>';
  try {
    const r = await fetch(`/api/fundamentals?symbol=${encodeURIComponent(sym)}` + (lynch ? `&lynch=${encodeURIComponent(lynch)}` : ''));
    data = await r.json();
    render();
    if (!data.error) {
      recent = [sym, ...recent.filter((s) => s !== sym)].slice(0, 10);
      store.set('fund_recent', recent);
      renderRecent();
    }
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="loading">Error: ${esc(e.message)}</div>`;
  }
}

document.getElementById('searchBtn').onclick = () => search();
document.getElementById('tickerInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
renderRecent();
const qs = new URLSearchParams(location.search).get('symbol');
if (qs) search(qs);
</script>
