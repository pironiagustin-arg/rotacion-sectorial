<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Análisis Fundamental</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262a33; --text:#e6e8eb; --muted:#8b8f99; --accent:#4C6EF5; --green:#2F9E44; --red:#E03131; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1 { font-size:18px; margin:0; }
  nav a { color:var(--muted); text-decoration:none; margin-left:16px; font-size:14px; }
  nav a:hover, nav a.active { color:var(--text); }
  .container { padding:20px; max-width:1200px; margin:0 auto; }
  .search-row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  input[type=text] { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:9px 14px; border-radius:8px; font-size:14px; width:140px; text-transform:uppercase; }
  button, select { font-family:inherit; }
  button.primary { background:var(--accent); color:#fff; border:none; padding:9px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
  .recent { display:flex; gap:6px; flex-wrap:wrap; }
  .recent button { background:var(--panel); border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
  .recent button:hover { color:var(--text); }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px; }
  .header-row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .company-name { font-size:22px; font-weight:600; }
  .company-sub, .muted { color:var(--muted); font-size:13px; }
  .lynch-row { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .lynch-badge { display:inline-block; background:#232838; border:1px solid var(--border); border-radius:999px; padding:3px 12px; font-size:12px; }
  select { background:#12151b; border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:8px; font-size:13px; }
  .score-ring { text-align:center; }
  .score-num { font-size:34px; font-weight:700; line-height:1; }
  .score-label { font-size:11px; color:var(--muted); margin-top:4px; }
  .price-big { font-size:26px; font-weight:600; text-align:right; }
  .score-detail { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .score-detail span { font-size:12px; color:var(--muted); background:#12151b; border:1px solid var(--border); border-radius:6px; padding:3px 8px; }
  .cards-title { font-size:12px; color:var(--muted); margin:0 0 10px; }
  .metrics-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .metric { background:#12151b; border:1px solid var(--border); border-left:4px solid #3a3f4b; border-radius:8px; padding:10px 12px; cursor:pointer; transition:background .15s; }
  .metric:hover { background:#161a22; }
  .metric.good { border-left-color:var(--green); }
  .metric.bad { border-left-color:var(--red); }
  .metric.sel { outline:1px solid var(--accent); }
  .metric .k { font-size:11px; color:var(--muted); }
  .metric .v { font-size:18px; font-weight:600; margin-top:2px; }
  .metric .d { font-size:11px; margin-top:2px; color:var(--muted); min-height:14px; }
  .metric.good .d { color:#69db7c; }
  .metric.bad .d { color:#ff8787; }
  .controls { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; margin-bottom:14px; }
  .controls label.lbl { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button { background:#12151b; color:var(--muted); border:none; padding:6px 12px; font-size:12px; cursor:pointer; border-right:1px solid var(--border); }
  .seg button:last-child { border-right:none; }
  .seg button.on { background:var(--accent); color:#fff; }
  .toggle { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .chart-wrap { position:relative; height:380px; }
  .loading { color:var(--muted); padding:40px; text-align:center; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; }
  @media (max-width:640px) { .chart-wrap { height:300px; } .price-big { text-align:left; } }
  .cat { margin-bottom:14px; } .cat:last-child { margin-bottom:0; }
  .cat-title { font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; padding-bottom:5px; border-bottom:1px solid var(--border); }
  .chart-panel.active { border-color:var(--accent); }
  .ptitle { font-size:12px; font-weight:600; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#12151b; border:1px solid var(--border); border-radius:999px; padding:3px 6px 3px 10px; font-size:12px; }
  .chip .x { background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 4px; }
  .chip .x:hover { color:#ff8787; }
  .rm { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:5px 9px; cursor:pointer; margin-left:auto; }
  .rm:hover { color:#ff8787; border-color:#ff8787; }
  .addpanel { width:100%; background:transparent; border:1px dashed var(--border); color:var(--muted); padding:14px; border-radius:12px; cursor:pointer; font-size:14px; margin-bottom:16px; }
  .addpanel:hover { color:var(--text); border-color:var(--accent); }
  .footnote { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5; }
  .footnote div { margin-top:3px; }
</style>
</head>
<body>
<header>
  <h1>🔎 Análisis Fundamental</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/rotation.html">RRG</a>
    <a href="/rotation-stocks.html">RRG Acciones</a>
    <a href="/fundamentals.html" class="active">Fundamental</a>
    <a href="/watchlist.html">Watchlist</a>
  </nav>
</header>

<div class="container">
  <div class="search-row">
    <input type="text" id="tickerInput" placeholder="AAPL" maxlength="8" />
    <button class="primary" id="searchBtn">Buscar</button>
    <div class="recent" id="recentList"></div>
  </div>
  <div id="content"><div class="loading">Buscá un ticker (ej: AAPL, MSFT, KO, NVDA) para ver su análisis fundamental.</div></div>
</div>

<script>
const COLORS = ['#4C6EF5', '#F59F00', '#2F9E44', '#E64980', '#AE3EC9', '#20C997'];
const CAT_ORDER = ['Valuación', 'Rentabilidad', 'Márgenes', 'Crecimiento', 'Dividendos', 'Solvencia', 'Caja', 'Resultados'];
// Métricas donde un valor MÁS BAJO es mejor (para colorear las tarjetas)
const LOWER_BETTER = new Set(['peRatio', 'peForward', 'peg', 'pbRatio', 'psRatio', 'debtToEquity', 'payoutRatio']);
const UNIT_NAME = { usd: 'USD', usdps: 'USD/acción', pct: '%', x: '×' };
const MAX_PER_PANEL = 4, MAX_PANELS = 4;
const DEV = 0.08; // ±8% respecto al promedio histórico propio

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const newPanel = (sel) => ({ sel, mode: 'annual', lookback: { annual: 5, quarterly: 8 }, avg: true });
function loadPanels() {
  const p = store.get('fund_panels', null);
  if (!Array.isArray(p) || !p.length) return [newPanel(['revenue', 'netMargin'])];
  return p.slice(0, MAX_PANELS).map((x) => ({
    sel: Array.isArray(x.sel) ? x.sel.slice(0, MAX_PER_PANEL) : [],
    mode: x.mode === 'quarterly' ? 'quarterly' : 'annual',
    lookback: { annual: Number(x.lookback?.annual ?? 5), quarterly: Number(x.lookback?.quarterly ?? 8) },
    avg: x.avg !== false,
  }));
}

let recent = store.get('fund_recent', []);
let panels = loadPanels();
let active = 0;
let data = null, charts = [];
const savePanels = () => store.set('fund_panels', panels);

function fmtBig(v) {
  if (v == null) return '—';
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e12) return s + (a / 1e12).toFixed(2) + 'T';
  if (a >= 1e9) return s + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return s + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return s + (a / 1e3).toFixed(2) + 'K';
  return s + a.toFixed(2);
}
function fmt(v, unit) {
  if (v == null || !isFinite(v)) return '—';
  if (unit === 'usd') return fmtBig(v);
  if (unit === 'usdps') return '$' + v.toFixed(2);
  if (unit === 'pct') return v.toFixed(1) + '%';
  if (unit === 'x') return v.toFixed(2) + '×';
  return String(v);
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderRecent() {
  const w = document.getElementById('recentList');
  w.innerHTML = '';
  recent.slice(0, 8).forEach((sym) => {
    const b = document.createElement('button');
    b.textContent = sym;
    b.onclick = () => { document.getElementById('tickerInput').value = sym; search(sym); };
    w.appendChild(b);
  });
}

// ---------- helpers de datos ----------
const catRank = (c) => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };
function hasSeries(key) { const m = data.metrics[key]; return !!m && (m.annual.some((x) => x.v != null) || m.quarterly.some((x) => x.v != null)); }
function series(key, mode) { return (data.metrics[key] && data.metrics[key][mode]) || []; }
function avgHist(key) {
  const a = (data.metrics[key]?.annual || []).slice(-10).map((x) => x.v).filter((v) => v != null && isFinite(v));
  const q = (data.metrics[key]?.quarterly || []).map((x) => x.v).filter((v) => v != null && isFinite(v));
  const use = a.length >= 3 ? a : q;
  return use.length >= 3 ? use.reduce((x, y) => x + y, 0) / use.length : null;
}
// categorías con sus métricas (ordenadas)
function byCategory(filterFn) {
  const groups = {};
  Object.entries(data.metrics).forEach(([k, m]) => { if (filterFn(k, m)) (groups[m.category] = groups[m.category] || []).push(k); });
  return Object.keys(groups).sort((a, b) => catRank(a) - catRank(b)).map((c) => [c, groups[c]]);
}

// ---------- tarjetas por categoría ----------
function cardsHtml() {
  const act = panels[active]?.sel || [];
  return byCategory((k, m) => m.current != null || hasSeries(k)).map(([cat, keys]) => {
    const cards = keys.map((k) => {
      const m = data.metrics[k];
      const cur = m.current, avg = avgHist(k);
      let cls = '', note = '';
      if (m.unit === 'usd' || m.unit === 'usdps') {
        note = k === 'dividendsPerShare' ? 'TTM' : 'último trim.';
      } else if (cur != null && avg != null && avg !== 0) {
        const dev = (cur - avg) / Math.abs(avg);
        if (Math.abs(dev) >= DEV) cls = (LOWER_BETTER.has(k) ? dev < 0 : dev > 0) ? 'good' : 'bad';
        note = (dev >= 0 ? '+' : '') + (dev * 100).toFixed(0) + '% vs prom. ' + fmt(avg, m.unit);
      } else if (!hasSeries(k)) note = 'solo valor actual';
      return `<div class="metric ${cls}${act.includes(k) ? ' sel' : ''}" data-key="${k}" title="Click para agregar/quitar del gráfico activo">
        <div class="k">${esc(m.label)}</div><div class="v">${fmt(cur, m.unit)}</div><div class="d">${note}</div></div>`;
    }).join('');
    return `<div class="cat"><div class="cat-title">${esc(cat)}</div><div class="metrics-grid">${cards}</div></div>`;
  }).join('');
}

function optionsHtml(exclude) {
  let h = '<option value="">+ Agregar métrica…</option>';
  byCategory((k) => hasSeries(k) && !exclude.includes(k)).forEach(([cat, keys]) => {
    h += `<optgroup label="${esc(cat)}">` + keys.map((k) => `<option value="${k}">${esc(data.metrics[k].label)}</option>`).join('') + '</optgroup>';
  });
  return h;
}
const lookbackOptions = (mode) => (mode === 'annual' ? [3, 5, 10, 0] : [4, 8, 12, 0]);

// ---------- gráficos ----------
function buildChart(i) {
  const P = panels[i];
  const keys = P.sel.filter((k) => data.metrics[k] && hasSeries(k));
  const box = document.getElementById('box_' + i);
  if (!keys.length) { box.innerHTML = '<div class="loading">Agregá al menos una métrica.</div>'; return; }
  box.innerHTML = `<canvas id="chart_${i}"></canvas>`;

  const set = new Set();
  keys.forEach((k) => series(k, P.mode).forEach((x) => set.add(x.p)));
  let labels = [...set].sort();
  const n = P.lookback[P.mode];
  if (n && labels.length > n) labels = labels.slice(-n);

  // ejes: métricas de la misma unidad comparten eje solo si su magnitud es parecida (dentro de 4×);
  // así PEG (~1) no queda aplastado contra un P/E (~30), ni la deuda/patrimonio contra el ratio corriente.
  const valsOf = (k) => { const map = new Map(series(k, P.mode).map((x) => [x.p, x.v])); return labels.map((l) => (map.has(l) ? map.get(l) : null)); };
  const mag = (k) => { const v = valsOf(k).filter((x) => x != null).map(Math.abs).sort((a, b) => a - b); return v.length ? v[Math.floor(v.length / 2)] || 1e-9 : 1e-9; };
  const axisOf = {}; const axes = [];
  keys.forEach((k) => {
    const u = data.metrics[k].unit, mg = mag(k);
    let ax = axes.find((a) => a.unit === u && Math.max(a.mag, mg) / Math.min(a.mag, mg) <= 4);
    if (!ax) { ax = { id: 'y' + axes.length, unit: u, mag: mg, keys: [] }; axes.push(ax); }
    ax.keys.push(k); axisOf[k] = ax.id;
  });

  const datasets = [];
  const scales = { x: { ticks: { color: '#8b8f99', maxRotation: 0, autoSkip: true }, grid: { color: '#262a33' } } };
  keys.forEach((k, idx) => {
    const m = data.metrics[k];
    const color = COLORS[P.sel.indexOf(k) % COLORS.length];
    const axis = axisOf[k];
    const vals = valsOf(k);
    const isBar = idx === 0 && m.unit === 'usd';
    datasets.push({ label: m.label, _k: k, data: vals, yAxisID: axis, borderColor: color, backgroundColor: isBar ? color + 'cc' : color,
      type: isBar ? 'bar' : 'line', borderWidth: 2, pointRadius: 3, tension: 0.2, spanGaps: true, order: isBar ? 3 : 1 });
    if ((k === 'peForward' || k === 'peg') && m.current != null) {
      datasets.push({ label: m.label + ' actual', _k: k, data: labels.map(() => m.current), yAxisID: axis, type: 'line', borderColor: color, borderDash: [3, 4], borderWidth: 1.5, pointRadius: 0, order: 0 });
    }
    if (P.avg) {
      const w = P.mode === 'annual' ? 3 : 4;
      const ma = vals.map((_, j) => {
        const win = vals.slice(Math.max(0, j - w + 1), j + 1).filter((v) => v != null);
        return win.length >= 2 ? win.reduce((a, b) => a + b, 0) / win.length : null;
      });
      datasets.push({ label: m.label + ' (prom. móvil ' + w + ')', _k: k, _ma: true, data: ma, yAxisID: axis, type: 'line', borderColor: color, borderDash: [7, 5], borderWidth: 1.2, pointRadius: 0, tension: 0.3, spanGaps: true, order: 2 });
    }
  });
  axes.forEach((a, j) => {
    const single = a.keys.length === 1;
    const c = single ? COLORS[P.sel.indexOf(a.keys[0]) % COLORS.length] : '#8b8f99';
    scales[a.id] = {
      type: 'linear', position: j === 0 ? 'left' : 'right',
      ticks: { color: c, callback: (v) => fmt(v, a.unit) },
      grid: { color: '#262a33', drawOnChartArea: j === 0 },
      title: { display: axes.length > 1, text: single ? data.metrics[a.keys[0]].label : a.keys.map((k) => data.metrics[k].label).join(' / '), color: c },
    };
  });

  charts[i] = new Chart(document.getElementById('chart_' + i).getContext('2d'), {
    data: { labels: labels.map((l) => (P.mode === 'annual' ? l : l.slice(2, 7).replace('-', '/'))), datasets },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#8b8f99', boxWidth: 10, font: { size: 11 }, filter: (it) => !it.text.includes('prom. móvil') } },
        tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + fmt(c.parsed.y, data.metrics[c.dataset._k]?.unit) } },
      },
      scales,
    },
  });
}

function panelHtml(P, i) {
  const chips = P.sel.filter((k) => data.metrics[k]).map((k) => `<span class="chip" style="border-color:${COLORS[P.sel.indexOf(k) % COLORS.length]}">
      <span class="dot" style="background:${COLORS[P.sel.indexOf(k) % COLORS.length]}"></span>${esc(data.metrics[k].label)}
      <button class="x" data-act="rmchip" data-i="${i}" data-k="${k}" title="Quitar">×</button></span>`).join('');
  const notes = P.sel.filter((k) => data.metrics[k]?.note).map((k) => `<div><b>${esc(data.metrics[k].label)}:</b> ${esc(data.metrics[k].note)}</div>`).join('');
  const full = P.sel.length >= MAX_PER_PANEL;
  return `<div class="panel chart-panel${i === active ? ' active' : ''}" data-i="${i}">
    <div class="controls">
      <span class="ptitle">Gráfico ${i + 1}</span>
      ${chips}
      <select data-act="add" data-i="${i}" title="${full ? 'Máximo ' + MAX_PER_PANEL + ' métricas: al agregar otra se quita la primera' : ''}">${optionsHtml(P.sel)}</select>
      <div class="seg"><button data-act="mode" data-i="${i}" data-v="annual" class="${P.mode === 'annual' ? 'on' : ''}">Anual</button><button data-act="mode" data-i="${i}" data-v="quarterly" class="${P.mode === 'quarterly' ? 'on' : ''}">Trimestral</button></div>
      <div class="seg">${lookbackOptions(P.mode).map((n) => `<button data-act="lb" data-i="${i}" data-v="${n}" class="${P.lookback[P.mode] === n ? 'on' : ''}">${n ? 'Últ. ' + n : 'Todo'}</button>`).join('')}</div>
      <label class="toggle"><input type="checkbox" data-act="avg" data-i="${i}" ${P.avg ? 'checked' : ''}/> Promedio móvil</label>
      ${panels.length > 1 ? `<button class="rm" data-act="rmpanel" data-i="${i}" title="Quitar gráfico">✕</button>` : ''}
    </div>
    <div class="chart-wrap" id="box_${i}"></div>
    ${notes ? `<div class="footnote">${notes}</div>` : ''}
  </div>`;
}

function render() {
  const c = document.getElementById('content');
  charts.forEach((ch) => ch && ch.destroy()); charts = [];
  if (data.error) { c.innerHTML = `<div class="loading">${esc(data.error)}</div>`; return; }

  if (data.history?.source === 'yahoo_price_only') {
    c.innerHTML = `<div class="panel">
      <div class="header-row"><div><div class="company-name">${esc(data.symbol)}</div>
      <div class="company-sub">${esc(data.name || '')} · ${esc(data.exchange || '')} · ${esc(data.currency || '')}</div></div>
      <div class="price-big">${data.price != null ? data.price.toFixed(2) : '—'}</div></div>
      <p class="muted" style="margin-top:14px;">${esc(data.note || '')}</p>
      <div class="chart-wrap" style="margin-top:10px;"><canvas id="priceChart"></canvas></div></div>`;
    const h = data.history.price || [];
    charts[0] = new Chart(document.getElementById('priceChart').getContext('2d'), {
      type: 'line',
      data: { labels: h.map((x) => new Date(x.t).toLocaleDateString('es-AR', { month: '2-digit', year: '2-digit' })), datasets: [{ label: 'Precio', data: h.map((x) => x.c), borderColor: '#4C6EF5', borderWidth: 1.5, pointRadius: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#8b8f99', maxTicksLimit: 10 }, grid: { color: '#262a33' } }, y: { ticks: { color: '#8b8f99' }, grid: { color: '#262a33' } } } },
    });
    return;
  }

  const sc = data.score || {};
  const scoreColor = sc.total >= 60 ? '#69db7c' : sc.total <= 40 ? '#ff8787' : '#e6e8eb';
  const compLabels = { growth: 'Crecimiento', profitability: 'Rentabilidad', valuation: 'Valuación', health: 'Solvencia' };
  const lynchOpts = Object.entries(data.lynchOptions || {}).map(([k, l]) => `<option value="${k}" ${data.lynch?.forced && k === data.lynch?.type ? 'selected' : ''}>${esc(l)}</option>`).join('');
  if (active >= panels.length) active = 0;

  c.innerHTML = `
  <div class="panel">
    <div class="header-row">
      <div>
        <div class="company-name">${esc(data.name)} <span class="muted">${esc(data.symbol)}</span></div>
        <div class="company-sub">${esc(data.exchange || '')} · Market cap: ${fmtBig(data.marketCap)} ${esc(data.currency || '')} · Historial ${data.history.annualYears}a / ${data.history.quarterlyPeriods}t</div>
        <div class="lynch-row"><span class="lynch-badge">${esc(data.lynch?.label || '—')}</span>
          <select id="lynchSel" title="Clasificación Lynch"><option value="" ${data.lynch?.forced ? '' : 'selected'}>Auto</option>${lynchOpts}</select></div>
      </div>
      <div class="score-ring"><div class="score-num" style="color:${scoreColor}">${sc.total ?? '—'}</div><div class="score-label">Score vs. propio historial</div></div>
      <div><div class="price-big">${data.price != null ? data.price.toFixed(2) : '—'}</div><div class="muted" style="text-align:right">${esc(data.currency || '')}</div></div>
    </div>
    <div class="score-detail">${Object.entries(sc.components || {}).map(([k, v]) => `<span>${compLabels[k] || k}: <b>${v ?? '—'}</b> <i>(×${sc.weights?.[k] ?? 1})</i></span>`).join('')}</div>
  </div>

  <div class="panel">
    <p class="cards-title">Verde/rojo: la métrica actual se desvía más de ±8% de su promedio histórico, a favor / en contra. Click en una tarjeta para agregarla o quitarla del <b>gráfico activo</b> (el que tiene borde azul).</p>
    <div id="cards">${cardsHtml()}</div>
  </div>

  <div id="panels">${panels.map(panelHtml).join('')}</div>
  ${panels.length < MAX_PANELS ? '<button class="addpanel" data-act="addpanel">+ Agregar gráfico</button>' : ''}`;

  panels.forEach((_, i) => buildChart(i));
}

// ---------- eventos (delegados) ----------
document.getElementById('content').addEventListener('click', (e) => {
  if (!data || data.error || data.history?.source === 'yahoo_price_only') return;
  const t = e.target;
  const act = t.dataset?.act;
  const panelEl = t.closest('.chart-panel');
  if (panelEl && !act) { const i = Number(panelEl.dataset.i); if (i !== active) { active = i; refreshSelection(); } return; }
  const i = Number(t.dataset?.i);
  if (act === 'mode') { panels[i].mode = t.dataset.v; active = i; savePanels(); render(); }
  else if (act === 'lb') { panels[i].lookback[panels[i].mode] = Number(t.dataset.v); active = i; savePanels(); render(); }
  else if (act === 'rmchip') { panels[i].sel = panels[i].sel.filter((k) => k !== t.dataset.k); active = i; savePanels(); render(); }
  else if (act === 'rmpanel') { panels.splice(i, 1); active = Math.min(active, panels.length - 1); savePanels(); render(); }
  else if (act === 'addpanel') { panels.push(newPanel(['peRatio'].filter((k) => hasSeries(k)))); active = panels.length - 1; savePanels(); render(); }
  else if (!act) {
    const card = t.closest('.metric');
    if (card) {
      const k = card.dataset.key;
      if (!hasSeries(k)) return;
      const P = panels[active];
      P.sel = P.sel.includes(k) ? P.sel.filter((x) => x !== k) : [...P.sel, k].slice(-MAX_PER_PANEL);
      savePanels(); render();
    }
  }
});
document.getElementById('content').addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'lynchSel') { search(data.symbol, t.value); return; }
  const i = Number(t.dataset?.i);
  if (t.dataset?.act === 'add' && t.value) { const P = panels[i]; P.sel = [...P.sel, t.value].slice(-MAX_PER_PANEL); active = i; savePanels(); render(); }
  else if (t.dataset?.act === 'avg') { panels[i].avg = t.checked; savePanels(); render(); }
});
function refreshSelection() {
  document.querySelectorAll('.chart-panel').forEach((el) => el.classList.toggle('active', Number(el.dataset.i) === active));
  const act = panels[active]?.sel || [];
  document.querySelectorAll('.metric').forEach((el) => el.classList.toggle('sel', act.includes(el.dataset.key)));
}

async function search(symOverride, lynch) {
  const sym = (symOverride || document.getElementById('tickerInput').value || '').trim().toUpperCase();
  if (!sym) return;
  document.getElementById('tickerInput').value = sym;
  document.getElementById('content').innerHTML = '<div class="loading">Cargando…</div>';
  try {
    const r = await fetch(`/api/fundamentals?symbol=${encodeURIComponent(sym)}` + (lynch ? `&lynch=${encodeURIComponent(lynch)}` : ''));
    data = await r.json();
    render();
    if (!data.error) {
      recent = [sym, ...recent.filter((s) => s !== sym)].slice(0, 10);
      store.set('fund_recent', recent);
      renderRecent();
    }
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="loading">Error: ${esc(e.message)}</div>`;
  }
}

document.getElementById('searchBtn').onclick = () => search();
document.getElementById('tickerInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
renderRecent();
const qs = new URLSearchParams(location.search).get('symbol');
if (qs) search(qs);
</script>
